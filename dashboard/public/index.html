      </div>
    </section>

    ${reviewedSection(tabId, reviewedTasks, isReport)}`;
}

/**
 * A board card is a COVER: identity and status only, so every card has the same
 * compact shape. Everything else — Task Type, dates, mail detail, attachments,
 * agent detail, and the Edit / Mark reviewed / Delete actions — lives in the
 * detail modal (detailModalHtml) behind "View full detail". Blocked cards use
 * the same cover and the same modal, with their safety-filter reason as the
 * status line. The staff-send checkbox stays on the cover so a bulk Send never
 * needs a modal per row.
 */
function coverCard(t, col, canSelect) {
  const key = `${t.tabName}|${t.rowIndex}`;
  const selectable = canSelect && t.category === 'overdue';
  const checked = selectable && state.staffSend.selected.has(t.rowIndex);
  const statusLine = t.category === 'attention' ? t.validationIssue : (t.status || 'Pending');
  return `<article class="ccc-kcard" style="--col:${col.colour}">
    <div class="ccc-kcard-top">
      ${selectable ? `<input type="checkbox" data-staff-select="${t.rowIndex}" ${checked ? 'checked' : ''} aria-label="Select row ${t.rowIndex} to send a reminder" />` : ''}
      ${sheetRowChip(t)}
    </div>
    <div class="ccc-kcard-title">${esc(t.taskDescription || '(untitled)')}</div>
    <div class="ccc-kcard-meta">${personCell(t)}</div>
    <div class="ccc-kcard-status"><div>${badge(t.category)}<div class="ccc-sub">${esc(statusLine)}</div></div></div>
    <div class="ccc-kcard-actions">
      <button class="ccc-expand" data-detail-open="${esc(key)}">View full detail →</button>
    </div>
  </article>`;
}

/** "row 19 · #14" — physical Sheet row first; the sheet's own "#" only as a label (see sheetLabel). */
function sheetRowChip(t) {
  const label = String(t.idNum ?? '').trim();
  return `<span class="ccc-kcard-row" title="Physical row number in the Google Sheet${label ? ` — "#${esc(label)}" is the sheet's own manual label` : ''}">row ${t.rowIndex}${label ? ` · #${esc(label)}` : ''}</span>`;
}

/**
 * Status donut — plain SVG, no chart library: one arc per board column on a
 * single circle via stroke-dasharray, 2px surface gap between slices, a native
 * <title> tooltip on each. Replaces the old numeric stat cards.
 */
function donut(counts) {
  const R = 54, C = 2 * Math.PI * R, GAP = 2;
  const segs = COLUMNS.map(c => ({ ...c, n: c.cats.reduce((a, k) => a + (counts[k] || 0), 0) })).filter(s => s.n > 0);
  const total = segs.reduce((a, s) => a + s.n, 0);

  let offset = 0;
  const arcs = segs.map(s => {
    const len = (s.n / total) * C;
    const draw = Math.max(len - GAP, Math.min(len, 1)); // never let the gap swallow a thin slice
    const arc = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.hatch ? 'url(#ccc-hatch)' : s.colour}" stroke-width="18"
        stroke-dasharray="${draw.toFixed(2)} ${(C - draw).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
        transform="rotate(-90 70 70)"><title>${esc(s.title)}: ${s.n} of ${total}</title></circle>`;
    offset += len;
    return arc;
  }).join('');

  return `<div class="ccc-donut-wrap">
    <svg class="ccc-donut" viewBox="0 0 140 140" role="img" aria-label="Status breakdown: ${COLUMNS.map(c => `${c.title} ${c.cats.reduce((a, k) => a + (counts[k] || 0), 0)}`).join(', ')}">
      <defs><pattern id="ccc-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
        <rect width="5" height="5" fill="var(--surface)" /><rect width="3" height="5" fill="var(--serious)" />
      </pattern></defs>
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--hairline)" stroke-width="18" opacity="0.5" />
      ${arcs}
    </svg>
    <div class="ccc-donut-centre"><div class="ccc-donut-total">${total}</div><div class="ccc-donut-label">rows</div></div>
  </div>`;
}

/** The numbers beside the donut: every column named, counted and given its share. */
function donutLegend(counts) {
  const segs = COLUMNS.map(c => ({ ...c, n: c.cats.reduce((a, k) => a + (counts[k] || 0), 0) }));
  const total = segs.reduce((a, s) => a + s.n, 0) || 1;
  return `<div class="ccc-dlegend">${segs.map(s => `
    <div class="ccc-dlegend-item">
      <span class="ccc-swatch" style="background:${s.hatch ? `repeating-linear-gradient(45deg, ${s.colour} 0 2px, var(--surface) 2px 3.5px); outline:1px solid ${s.colour}` : s.colour}"></span>
      <span class="ccc-dlegend-name">${s.icon} ${esc(s.title)} <span class="ccc-k">· ${s.cats.map(k => esc(CATEGORY_META[k].label)).join(' + ')}</span></span>
      <span class="ccc-dlegend-n">${s.n}</span>
      <span class="ccc-dlegend-pct">${Math.round((s.n / total) * 100)}%</span>
    </div>`).join('')}</div>`;
}

// --- summary widgets (2x2 grid beside the donut) -----------------------------

/**
 * Pending approvals + recent activity for one board, from GET /api/tab-summary.
 * Deliberately NOT awaited by load(): the board renders from /api/tasks alone
 * and this lands a moment later, so it can never delay the board. On arrival
 * only the widget grid is redrawn — a full render() here could wipe an edit
 * form the operator is typing into inside the detail modal.
 */
function loadTabSummary(tab) {
  const d = state.data[tab];
  api(`/api/tab-summary?tab=${encodeURIComponent(d.tab)}`)
    .catch(err => ({ error: err.message }))
    .then(s => {
      if (state.data[tab] !== d) return; // a newer load has replaced this data
      d.summary = s;
      const host = document.querySelector('[data-tab-summary]');
      if (host && state.tab === tab) host.innerHTML = summaryWidgets(tab);
    });
}

const WIDGET_CAP = 5;
const miniPanel = (title, body) => `<section class="ccc-mini"><h4>${esc(title)}</h4>${body}</section>`;
const miniEmpty = text => `<div class="ccc-mini-empty">${esc(text)}</div>`;
/** At most WIDGET_CAP items, then a plain "+N more" — no paging. */
function miniList(items, renderItem) {
  const more = items.length - WIDGET_CAP;
  return `<ul class="ccc-mini-list">${items.slice(0, WIDGET_CAP).map(renderItem).join('')}</ul>` +
    (more > 0 ? `<div class="ccc-mini-more">+${more} more</div>` : '');
}

/**
 * Days past due for an Overdue row. Report Calendar and MIS carry the Sheet's
 * own "Overdue days" column. Staff Tracker's "Days" cell is blank on every
 * live row, so there it is counted from the due date instead; null when
 * neither exists (sorted last, shown as "—").
 */
function daysOverdue(t, tabId) {
  if (tabId !== 'staff') {
    const n = Number(String(t.days ?? '').trim());
    return String(t.days ?? '').trim() !== '' && Number.isFinite(n) ? n : null;
  }
  if (!t.dueDateISO) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((today - new Date(`${t.dueDateISO}T00:00:00`)) / 86_400_000));
}

const RTF = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
function relTime(v) {
  const sec = (new Date(v) - Date.now()) / 1000;
  if (!Number.isFinite(sec)) return '—';
  for (const [unit, s] of [['year', 31_536_000], ['month', 2_592_000], ['week', 604_800], ['day', 86_400], ['hour', 3_600], ['minute', 60]]) {
    if (Math.abs(sec) >= s) return RTF.format(Math.round(sec / s), unit);
  }
  return 'just now';
}

/** The four read-only panels. Blocked + Overdue come from data already loaded; the rest from d.summary. */
function summaryWidgets(tabId) {
  const d = state.data[tabId];
  const s = d.summary; // undefined = still loading, {error} = failed
  const loading = miniEmpty('Loading…');
  const blocked = (d.attention || []).filter(r => r.tabName === d.tab);
  // Board rows only — a reviewed row has left the board, and its detail modal with it.
  const onBoard = (d.tasks || []).filter(t => !t.reviewedAt);

  // 1. Blocking reasons — the Blocked column's own rows, grouped by why.
  const reasons = Object.entries(blocked.reduce((a, r) => {
    const k = r.validationIssue || 'Fails the safety filter';
    return { ...a, [k]: (a[k] || 0) + 1 };
  }, {})).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const w1 = reasons.length
    ? miniList(reasons, ([why, n]) => `<li><span>${esc(why)}</span><b>${n}</b></li>`)
    : miniEmpty('Nothing blocked');

  // 2. Longest overdue — opens the same detail modal the cards use.
  const overdue = onBoard.filter(t => t.category === 'overdue').map(t => ({ t, days: daysOverdue(t, tabId) }))
    .sort((a, b) => (b.days ?? -1) - (a.days ?? -1) || a.t.rowIndex - b.t.rowIndex);
  const w2 = overdue.length
    ? miniList(overdue, ({ t, days }) => `<li>
        <button class="ccc-mini-link" data-detail-open="${esc(`${t.tabName}|${t.rowIndex}`)}">${esc(t.taskDescription || '(untitled)')}</button>
        <b title="${tabId === 'staff' ? 'Days since the due date' : 'The Sheet\'s Overdue days column'}">${days ?? '—'}${days === null ? '' : 'd'}</b></li>`)
    : miniEmpty('Nothing overdue');

  // 3. Pending approvals. Staff Tracker has no approval step at all, so it gets
  // an explanation instead of a misleading "0 pending" — and is never queried.
  let w3;
  if (tabId === 'staff') w3 = miniEmpty('No approval queue — Staff Tracker reminders go out immediately when you press Send.');
  else if (!s) w3 = loading;
  else if (s.error || s.approvals?.error) w3 = miniEmpty(`Couldn't check approvals: ${s.error || s.approvals.error}`);
  else if (!s.approvals?.runs.length) w3 = miniEmpty('No pending approvals');
  else {
    const runs = s.approvals.runs;
    const names = [...new Set(runs.flatMap(r => r.descriptions))];
    const unreadable = runs.filter(r => r.unverified).length;
    w3 = `<div class="ccc-mini-count"><b>${runs.length}</b> pending run${runs.length === 1 ? '' : 's'} on this tab</div>` +
      (names.length ? miniList(names, n => `<li><span>${esc(n)}</span></li>`) : '') +
      (unreadable ? `<div class="ccc-mini-more">${unreadable} run${unreadable === 1 ? '' : 's'} could not be read — check by hand</div>` : '') +
      `<button class="ccc-mini-link ccc-mini-cta" data-goto-approvals>Open Approval requests →</button>`;
  }

  // 4. Recent activity — last 5 across reminders sent, replies matched, marked reviewed.
  const KIND = { sent: 'Reminder sent', reply: 'Reply matched', reviewed: 'Marked reviewed' };
  const nameOf = row => ([...(d.tasks || []), ...blocked].find(t => t.rowIndex === row)?.taskDescription) || `row ${row}`;
  let w4;
  if (!s) w4 = loading;
  else if (s.error || s.dbWarning) w4 = miniEmpty(`Couldn't load activity: ${s.error || s.dbWarning}`);
  else if (!s.activity?.length) w4 = miniEmpty('No activity recorded on this tab yet');
  else w4 = miniList(s.activity, e => `<li>
      <span><b class="ccc-mini-kind">${esc(KIND[e.kind] || e.kind)}</b> · ${esc(nameOf(e.rowIndex))}</span>
      <span class="ccc-mini-time" title="${esc(fmtDate(e.at))}">${esc(relTime(e.at))}</span></li>`);

  return miniPanel('Blocking reasons', w1) + miniPanel('Longest overdue', w2) +
    miniPanel('Pending approvals', w3) + miniPanel('Recent activity', w4);
}

/** Expanded per-row detail: remarks, clickable thread link, attachment links. */
function agentDetail(t) {
  const sub = t.submission;
  const thread = sub?.threadId || t.threadId;
  const rows = [];

  // Lead with the identity every other view uses, so a row can be cross-referenced
  // without wondering which "number" is being shown.
  rows.push(
    `<b>Sheet row:</b> ${t.rowIndex} in "${esc(t.tabName)}"` +
      (String(t.idNum ?? '').trim() ? ` <span class="ccc-sub">(sheet "#" label: ${esc(t.idNum)})</span>` : '')
  );
  rows.push(`<b>Remarks:</b> ${t.remarks ? linkifyText(t.remarks) : '—'}`);

  if (sub) {
    rows.push(`<b>Matched email:</b> ${esc(sub.subject || '(no subject)')} — ${fmtDate(sub.dateReceived)}`);
    rows.push(
      sub.attachments?.length
        ? `<b>Attachments:</b> ${attachmentLinks(sub.attachments)}`
        : `<b>Attachments:</b> none on the matched email`
    );

    // Generated once by the pipeline when this submission was matched and cached
    // in submissions.attachment_summary, so it arrives with /api/tasks — nothing
    // is fetched or generated on expand. Absent (no GEMINI_API_KEY, no
    // attachments, or the call failed) renders nothing at all, never a
    // placeholder for a summary that may never exist.
    if (sub.attachmentSummary) {
      rows.push(`<b>Attachment Summary:</b> ${esc(sub.attachmentSummary)}`);
    }
  }

  if (thread) {
    rows.push(`<b>Gmail thread:</b> ${threadLink(thread, 'Open thread')} <span class="ccc-sub">${esc(thread)}</span>`);
  }

  return `<div class="ccc-detail">${rows.join('<br>')}</div>`;
}

/**
 * opts.idPrefix namespaces the DOM id (and the dropdown listbox id) so a second
 * form — the row Edit form — can render the same field names as the Add-a-Task
 * form without colliding ids on the page (duplicate ids break `<label for>` and
 * would make the label click focus the WRONG form's input).
 * opts.value pre-fills the field (Edit form); opts.errors overrides which error
 * bag is read, so an Edit form's errors never leak onto the Add form's fields.
 */
function field(name, label, type = 'text', required = false, opts = {}) {
  const idPrefix = opts.idPrefix || '';
  const id = `${idPrefix}f-${name}`;
  const err = (opts.errors || state.formErrors)[name];
  if (type === 'select') {
    // Sourced from GET /api/task-types (src/util/task-type.ts) — one canonical
    // list, not a second copy hardcoded here that could drift from the backend.
    const known = state.taskTypeOptions || [];
    const current = opts.value || '';
    // The row's current value is always offered even if it isn't in the
    // canonical list (blank, or legacy free text already on the Sheet) —
    // rendering the field must never itself change data by dropping it.
    const options = !current || known.includes(current) ? known : [current, ...known];
    return `<div class="ccc-field"><label for="${id}">${esc(label)}</label>
      <select id="${id}" name="${name}">
        <option value="" ${current ? '' : 'selected'}>—</option>
        ${options.map(o => `<option value="${esc(o)}" ${o === current ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }
  // Date Assigned defaults to today — it is almost always "now", and a blank
  // required field is the most common reason the Add Task form fails validation.
  // An explicit opts.value (Edit form pre-fill) always wins over that default.
  const defaultValue = opts.value !== undefined && opts.value !== null
    ? ` value="${esc(opts.value)}"`
    : (type === 'date' && name === 'dateAssigned' ? ` value="${todayISO()}"` : '');
  // autocomplete="off" suppresses the browser's own saved-value popup, which
  // would otherwise appear on top of our dropdown.
  const noAuto = opts.dropdown ? ' autocomplete="off"' : '';
  const combo = opts.dropdown
    ? ` role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="ccc-dd-list"`
    : '';
  const input = `<input id="${id}" name="${name}" type="${type}"${defaultValue}${noAuto}${combo} ${required ? 'required' : ''} />`;

  return `<div class="ccc-field" data-invalid="${Boolean(err)}">
    <label for="${id}">${esc(label)}${required ? ' *' : ''}</label>
    ${opts.dropdown
      ? `<div class="ccc-dd-wrap">${input}<div class="ccc-dd" id="ccc-dd-list" role="listbox" hidden></div></div>`
      : input}
    ${err ? `<span class="ccc-error">${esc(err)}</span>` : ''}
    <span class="ccc-hint" data-hint-for="${name}">${opts.hint ? esc(opts.hint) : ''}</span>
  </div>`;
}

/**
 * Every view identifies a row by its PHYSICAL sheet row number.
 *
 * The sheet's own "#" column is a hand-typed label that drifts out of step with
 * the physical row (the tabs open with a title block, so "#14" is physical row
 * 19). Mixing the two made "row 14" mean two different tasks depending on which
 * table you were reading. The "#" label is still shown, but only ever as a
 * clearly-marked secondary value — never as the row's identity.
 */
function sheetLabel(idNum) {
  const label = String(idNum ?? '').trim();
  return label ? `<div class="ccc-sub" title="The sheet's own '#' column — a manual label, not the row number">#${esc(label)}</div>` : '';
}

/**
 * Inline Task Type editor for one row. The current value is always offered as
 * an option even if it isn't in the canonical list (blank, or old free text
 * already on the Sheet) — rendering the field must never itself change data.
 */
function taskTypeEditor(t, readOnly = false) {
  // The MIS registers still carry requiresConfirmation, so nothing in this UI may
  // write to them — the CLI itself refuses without --i-mean-it, and a dropdown
  // here would be a quieter way around that. Shown as plain text instead; the
  // server refuses the edit too (403), so this is presentation, not the guard.
  if (readOnly) {
    return `<div class="ccc-tasktype-row">
      <span class="ccc-badge ccc-cat-pending" title="Read-only — edit the Task Type in the Sheet itself">${esc(t.taskType || '— unspecified —')}</span>
    </div>`;
  }

  const key = `${t.tabName}|${t.rowIndex}`;
  const busy = state.taskTypeEditing[key] === 'busy';
  const result = typeof state.taskTypeEditing[key] === 'object' ? state.taskTypeEditing[key] : null;

  const current = t.taskType || '';
  const known = state.taskTypeOptions || [];
  const options = known.includes(current) || !current ? known : [current, ...known];

  const select = `<select class="ccc-tasktype-select" data-tasktype-select="${esc(t.tabName)}|${t.rowIndex}" ${busy ? 'disabled' : ''}>
    <option value="" ${current ? '' : 'selected'}>— unspecified —</option>
    ${options.map(o => `<option value="${esc(o)}" ${o === current ? 'selected' : ''}>${esc(o)}</option>`).join('')}
  </select>`;

  const feedback = busy
    ? `<span class="ccc-sub">Saving…</span>`
    : result
      ? `<span class="ccc-sub ${result.ok ? 'ccc-note-good' : 'ccc-note-bad'}">${esc(result.message)}</span>`
      : '';

  return `<div class="ccc-tasktype-row">${select}${feedback}</div>`;
}

/**
 * Inline edit form for one existing row (Task List or Needs Attention),
 * pre-filled with its current values. Deliberately the SAME fields, labels and
 * validation as the "Add a Task" form below (field() is the same function) —
 * the server's validateNewTask doesn't care whether the row is new or existing,
 * only the target (an existing rowIndex vs. a fresh append) differs.
 */
function editForm(t, isReport) {
  const idp = `edit${t.rowIndex}-`;
  const f = (name, label, type, required, value) =>
    field(name, label, type, required, { idPrefix: idp, errors: state.editFormErrors, value });
  return `<div class="ccc-detail" style="background:var(--surface-2)">
    <form class="ccc-form" data-form="edit">
      ${f('taskDescription', isReport ? 'Report name' : 'Task description', 'text', true, t.taskDescription)}
      ${f('assignedTo', isReport ? 'Source / who sends' : 'Assigned to', 'text', false, t.assignedTo)}
      ${f('emailId', 'Email ID', 'email', true, t.emailId)}
      ${f('taskType', 'Task type', 'select', false, t.taskType)}
      ${isReport
        ? f('dueDate', 'Review timing', 'text', false, t.dueDate)
        // ISO copies, not the raw Sheet text — see toISODateInput's own comment
        // for why a non-ISO value here would silently blank on save.
        : f('dateAssigned', 'Date assigned', 'date', true, t.dateAssignedISO) + f('dueDate', 'Due date', 'date', false, t.dueDateISO)}
    </form>
    <div class="ccc-actions">
      <button class="ccc-btn" data-submit="edit">💾 Save changes</button>
      <button class="ccc-btn ccc-btn-ghost" data-edit-cancel>Cancel</button>
      <span class="ccc-note">${state.editFormNote ? `<span class="${state.editFormNote.ok ? 'ccc-note-good' : 'ccc-note-bad'}">${esc(state.editFormNote.text)}</span>` : ''}</span>
    </div>
  </div>`;
}

/**
 * Collapsed-by-default "Reviewed" section — same pattern as the approvals tab's
 * "Show expired" toggle. Purely a dashboard-side view filter (reviewed_tasks):
 * it never changes classification, reminders, or Sheet data.
 */
function reviewedSection(tabId, reviewedTasks, isReport) {
  if (!reviewedTasks.length) return '';
  const open = Boolean(state.showReviewed[tabId]);
  const rows = reviewedTasks.map(t => {
    const key = `${t.tabName}|${t.rowIndex}`;
    const busy = state.reviewedBusy[key];
    return `<tr>
      <td class="ccc-num">${t.rowIndex}${sheetLabel(t.idNum)}</td>
      <td class="ccc-primary">${esc(t.taskDescription || '(untitled)')}</td>
      <td>${personCell(t)}</td>
      <td>${badge(t.category)}<div class="ccc-sub">${esc(t.status || 'Pending')}</div></td>
      <td class="ccc-sub">${fmtDate(t.reviewedAt)}</td>
      <td><button class="ccc-btn ccc-btn-ghost" data-unreview="${esc(key)}" ${busy ? 'disabled' : ''}>${busy ? 'Saving…' : '↩ Unmark'}</button></td>
    </tr>`;
  }).join('');

  return `<section class="ccc-card ccc-card-muted">
    <header><div>
      <button class="ccc-expand" data-toggle-reviewed="${esc(tabId)}">${open ? 'Hide' : 'Show'} reviewed (${reviewedTasks.length})</button>
      <p>Marked reviewed from this dashboard — a bookkeeping note kept separately from the Sheet, not a Sheet edit.</p>
    </div></header>
    ${open ? `<div class="ccc-scroll"><table class="ccc-table">
      <thead><tr>
        <th class="ccc-num" title="Physical row number in the Google Sheet">Sheet row</th><th>${isReport ? 'Report' : 'Task'}</th><th>Name</th><th>Status</th><th>Reviewed</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : ''}
  </section>`;
}

/**
 * "Name (Email ID)" for a row's person cell, from the Sheet's dedicated person
 * column — "Names" (col E) on Staff Tracker, "Name" (col F) on Report Calendar
 * and both MIS registers.
 *
 * Not `assignedTo`: that column is "Assigned To" / "Source / Who Sends", which
 * carries role labels on Staff Tracker ("Accounts team", "Finance Controller")
 * and section headers on the MIS registers ("OTHER ACTIVITIES — MONTH CLOSING").
 * Those are still shown, de-emphasised underneath, because for reports the
 * source genuinely is useful context — but they are no longer the row's identity.
 *
 * Falls back to assignedTo when the person column is blank, so the cell is never
 * empty, and omits the parenthesised address when there is no email rather than
 * rendering "Name ()".
 */
function personCell(t) {
  const name = (t.personName || '').trim();
  const email = (t.emailId || '').trim();
  const source = (t.assignedTo || '').trim();

  const primary = name
    ? (email ? `${esc(name)} (${esc(email)})` : esc(name))
    : (email ? esc(email) : esc(source || '—'));

  // Only worth a second line when it says something the first line does not.
  const showSource = source && source !== name && (name || email);
  return `<div class="ccc-primary">${primary}</div>` +
    (showSource ? `<div class="ccc-sub">${esc(source)}</div>` : '');
}

/** Directory entries as {name, email}, newest lookup source for autofill. */
function directoryEntries() {
  return (state.data.directory?.employees || []).filter(e => e.name && e.email);
}

/**
 * Exact, case-insensitive, whitespace-trimmed name match against the Directory.
 * Deliberately exact: a prefix match would rewrite the email out from under
 * someone halfway through typing a different colleague's name.
 */
function findDirectoryByName(typedName) {
  const needle = (typedName || '').trim().toLowerCase();
  if (!needle) return null;
  return directoryEntries().find(e => e.name.trim().toLowerCase() === needle) || null;
}

function directoryView() {
  const d = state.data.directory;
  if (!d) return '';
  const rows = (d.employees || []).map(e => `<tr>
    <td class="ccc-primary">${esc(e.name)}</td>
    <td>${esc(e.email)}</td>
    <td>${esc(e.department || '—')}</td>
    <td class="ccc-sub">${fmtDate(e.created_at)}</td>
  </tr>`).join('');

  return `
    <div class="ccc-pagehead">
      <h1>Directory</h1>
      <p>${(d.employees || []).length} employee record${(d.employees || []).length === 1 ? '' : 's'} in Postgres.</p>
    </div>
    ${warnBox(d.dbWarning)}
    <section class="ccc-card">
      <header><div>
        <h3>Employees</h3>
      </div></header>
      <div class="ccc-scroll">
        ${rows ? `<table class="ccc-table"><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Added</th></tr></thead><tbody>${rows}</tbody></table>`
               : `<div class="ccc-empty">No employees yet.${d.dbWarning ? '' : ' Add one below.'}</div>`}
      </div>
    </section>
    <section class="ccc-card">
      <header><div><h3>Add to directory</h3><p>Upserts on email — re-adding an existing address updates the name.</p></div></header>
      <form class="ccc-form" data-form="directory">
        ${field('name', 'Name', 'text', true)}
        ${field('email', 'Email', 'email', true)}
        ${field('department', 'Department', 'text')}
      </form>
      <div class="ccc-actions">
        <button class="ccc-btn" data-submit="directory">＋ Add employee</button>
        ${state.formNote ? `<span class="ccc-note ${state.formNote.ok ? 'ccc-note-good' : 'ccc-note-bad'}">${esc(state.formNote.text)}</span>` : ''}
      </div>
    </section>`;
}

function monitorView() {
  const d = state.data.monitor;
  if (!d) return '';
  const stats = d.stats || [];
  const max = Math.max(1, ...stats.map(s => s.totalTasks));

  const pagehead = `<div class="ccc-pagehead">
    <h1>Employee Monitor</h1>
    <p>Performance, approvals, and dispatch history across both tabs.</p>
  </div>`;

  const subtabs = `<div class="ccc-subtabs">
    ${[['stats', 'Performance'], ['approvals', `Approval requests${(d.approvals || []).length ? ` (${d.approvals.length})` : ''}`], ['logs', 'Reminder log']]
      .map(([id, label]) => `<button class="ccc-subtab" role="tab" aria-selected="${state.monitorView === id}" data-subtab="${id}">${esc(label)}</button>`).join('')}
  </div>`;

  if (state.monitorView === 'approvals') {
    // "Dead" covers both ways a run stops being actionable: the DB already marked
    // it EXPIRED (e.g. via npm run discard:run), or it's still PENDING in the DB
    // but its approval window has simply passed — the backend only flips that
    // row's status the next time something touches it. Both need the same
    // explanatory treatment, not a button that merely looks disabled.
    const withExpiry = (d.approvals || []).map(a => ({
      ...a,
      isDead: a.status === 'EXPIRED' || (a.status === 'PENDING' && new Date(a.expires_at) < new Date()),
    }));
    const active = withExpiry.filter(a => !a.isDead);
    const dead = withExpiry.filter(a => a.isDead);

    const rowHtml = a => {
      const busy = state.approving[a.run_id];
      const canApprove = a.status === 'PENDING' && !a.isDead && busy !== 'busy';
      const actionCell = a.isDead
        ? `<span class="ccc-note ccc-note-bad">Expired — no longer actionable. Re-run the pipeline to generate fresh reminders for these rows.</span>`
        : a.status === 'PENDING'
          ? `<button class="ccc-btn" data-approve="${esc(a.run_id)}" ${canApprove ? '' : 'disabled'}>${busy === 'busy' ? 'Sending…' : '✓ Approve &amp; send'}</button>`
          : '—';
      return `<tr>
        <td><span class="ccc-primary" style="font-variant-numeric:tabular-nums">${esc(a.run_id)}</span>
            <div class="ccc-sub">${a.reminder_count} reminder${a.reminder_count === 1 ? '' : 's'}</div></td>
        <td>${statusBadge(a.isDead ? 'EXPIRED' : a.status)}</td>
        <td class="ccc-sub">${fmtDate(a.created_at)}</td>
        <td class="ccc-sub">${fmtDate(a.expires_at)}${a.isDead && a.status === 'PENDING' ? '<div class="ccc-note-bad">window closed</div>' : ''}</td>
        <td class="ccc-action-cell">
          ${actionCell}
          ${busy && busy !== 'busy' ? `<div class="ccc-sub">${esc(busy)}</div>` : ''}
        </td>
      </tr>`;
    };

    const activeRows = active.map(rowHtml).join('');
    const deadRows = dead.map(rowHtml).join('');
    const tableHead = `<thead><tr><th>Run ID</th><th>Status</th><th>Created</th><th>Expires</th><th>Action</th></tr></thead>`;

    return `${pagehead}${subtabs}
      ${warnBox(d.approvalWarning)}
      <section class="ccc-card">
        <header><div>
          <h3>Approval requests</h3>
          <p>Approving dispatches the drafted reminders through the same code path as <code>npm run agent -- --approve</code>. Window: ${state.health?.approvalTimeoutHours ?? 4}h.</p>
        </div></header>
        <div class="ccc-scroll">
          ${activeRows ? `<table class="ccc-table">${tableHead}<tbody>${activeRows}</tbody></table>`
                       : `<div class="ccc-empty">No active approval requests. One appears here after a pipeline run finds overdue tasks — <code>npm run agent</code>.</div>`}
        </div>
      </section>

      ${dead.length ? `<section class="ccc-card ccc-card-muted">
        <header><div>
          <button class="ccc-expand" data-toggle-expired>${state.showExpiredApprovals ? 'Hide' : 'Show'} expired (${dead.length})</button>
          <p>Past their approval window. Kept for the audit trail — not deleted automatically.</p>
        </div></header>
        ${state.showExpiredApprovals ? `<div class="ccc-scroll"><table class="ccc-table">${tableHead}<tbody>${deadRows}</tbody></table></div>` : ''}
      </section>` : ''}`;
  }

  if (state.monitorView === 'logs') {
    const rows = (d.logs || []).map(l => `<tr>

      <td>${statusBadge(l.status)}${l.status === 'SENT' && l.message_id ? `<div class="ccc-sub">id ${esc(String(l.message_id).slice(0, 12))}…</div>` : ''}${l.status === 'FAILED' && l.error_text ? `<div class="ccc-sub ccc-note-bad">${esc(String(l.error_text).slice(0, 50))}</div>` : ''}</td>
    </tr>`).join('');
    return `${pagehead}${subtabs}
      ${warnBox(d.logWarning)}
      <section class="ccc-card">
        <header><div><h3>Reminder log</h3><p>Most recent 200 dispatches.</p></div></header>
        <div class="ccc-scroll">

                 : `<div class="ccc-empty">No reminders dispatched yet.</div>`}
        </div>
      </section>`;
  }

  const rows = stats.map(s => {
    const seg = (n, colour, label) => n > 0 ? `<span style="background:${colour};flex:${n}" title="${esc(label)}: ${n}"></span>` : '';
    const untracked = s.totalTasks - s.onTimeCount - s.lateCount - s.overdueCount;
    return `<tr>
      <td><div class="ccc-primary">${esc(s.name)}</div><div class="ccc-sub">${esc(s.email)}</div></td>
      <td style="min-width:150px">
        <div class="ccc-bar" style="width:${Math.round((s.totalTasks / max) * 100)}%">

          ${seg(s.lateCount, 'var(--serious)', 'Late')}
          ${seg(s.overdueCount, 'var(--critical)', 'Overdue')}

        </div>
      </td>
      <td class="ccc-num">${s.totalTasks}</td>
      <td class="ccc-num">${s.onTimeCount}</td>
      <td class="ccc-num">${s.lateCount}</td>
      <td class="ccc-num">${s.overdueCount}</td>
      <td class="ccc-num">${s.remindersSent}</td>
    </tr>`;
  }).join('');

  return `${pagehead}${subtabs}
    ${warnBox(d.dbWarning)}
    ${personChart(d.people)}
    <section class="ccc-card">
      <header>
        <div><h3>Per-employee performance</h3><p>Derived from live Sheet statuses across both tabs; reminders sent from the log table.</p></div>
        <div class="ccc-legend">
          <span><span class="ccc-dot" style="background:var(--good)"></span>On time</span>
          <span><span class="ccc-dot" style="background:var(--serious)"></span>Late</span>
          <span><span class="ccc-dot" style="background:var(--critical)"></span>Overdue</span>

        </div>
      </header>
      <div class="ccc-scroll">
        ${rows ? `<table class="ccc-table"><thead><tr>
            <th>Employee</th><th>Mix</th><th class="ccc-num">Tasks</th><th class="ccc-num">On time</th>
            <th class="ccc-num">Late</th><th class="ccc-num">Overdue</th><th class="ccc-num">Reminders</th>
          </tr></thead><tbody>${rows}</tbody></table>`
               : `<div class="ccc-empty">No employee metrics yet — they are computed from Sheet rows that pass the safety filter.</div>`}
      </div>
    </section>`;
}

/**
 * Stacked bar per person (the Sheet's Name column — see personStatusCounts in
 * logic.ts), segmented by status. The server sends every person already sorted;
 * the top PERSON_TOP_N get a bar each and everyone else is summed into one
 * "Other" bar, so the bars always add up to every valid row.
 */
const PERSON_STACK = ['overdue', 'unclear', 'pending', 'early', 'received'];

function personChart(people) {
  const head = `<header>
      <div><h3>Workload by person</h3><p>Every valid row across all four registers, grouped by the Sheet's Name column — top ${PERSON_TOP_N} by row count, the rest in Other.</p></div>
      ${people ? `<div class="ccc-legend">${PERSON_STACK.map(k => `<span><span class="ccc-dot" style="background:${CATEGORY_META[k].colour}"></span>${CATEGORY_META[k].icon} ${esc(CATEGORY_META[k].label)} <b>${people.reduce((n, p) => n + (p.counts[k] || 0), 0)}</b></span>`).join('')}</div>` : ''}
    </header>`;
  // A server started before this chart existed sends no `people` — say so
  // instead of drawing an empty chart that looks like "nobody has any rows".
  if (!people) return `<section class="ccc-card">${head}<div class="ccc-empty">This server predates the per-person chart — restart it (<code>npm run dashboard</code>) to see it.</div></section>`;
  if (!people.length) return `<section class="ccc-card">${head}<div class="ccc-empty">No valid rows on any register yet.</div></section>`;

  const rest = people.slice(PERSON_TOP_N);
  const bars = people.slice(0, PERSON_TOP_N);
  if (rest.length) {
    const counts = {};
    for (const p of rest) for (const [k, n] of Object.entries(p.counts)) counts[k] = (counts[k] || 0) + n;
    bars.push({ name: `Other · ${rest.length} people`, isOther: true, members: rest, total: rest.reduce((n, p) => n + p.total, 0), counts, emails: [] });
  }
  const max = Math.max(1, ...bars.map(b => b.total));

  return `<section class="ccc-card">${head}
    <div class="ccc-pbars" data-person-bars>${bars.map(b => {
      const who = b.isOther ? b.members.map(p => `${p.name} (${p.total})`).join(', ') : `${b.name} — ${b.emails.join(', ') || 'no email'}`;
      const mix = PERSON_STACK.filter(k => b.counts[k]).map(k => `${CATEGORY_META[k].label} ${b.counts[k]}`).join(', ');
      return `<div class="ccc-pbar-row" title="${esc(who)} · ${esc(mix)}">
        <div class="ccc-pbar-name" ${b.isOther ? 'style="font-style:italic;color:var(--ink-2)"' : ''}>${esc(b.name)}</div>
        <div class="ccc-pbar" style="width:${((b.total / max) * 100).toFixed(1)}%">
          ${PERSON_STACK.filter(k => b.counts[k]).map(k =>
            `<span style="background:${CATEGORY_META[k].colour};flex:${b.counts[k]}" title="${esc(CATEGORY_META[k].label)}: ${b.counts[k]}"></span>`).join('')}
        </div>
        <div class="ccc-pbar-total">${b.total}</div>
      </div>`;
    }).join('')}</div>
  </section>`;
}

function healthBar() {
  const h = state.health;
  if (!h) return '';
  const chip = (ok, label) => `<span class="ccc-chip"><span class="ccc-dot" style="background:${ok ? 'var(--good)' : 'var(--critical)'}"></span>${esc(label)}</span>`;
  return [
    chip(h.serviceAccount, 'Sheet'),

/** Fields /api/tasks rows must carry for this page to render correctly. */
const EXPECTED_TASK_FIELDS = ['personName', 'reviewedAt', 'dateAssignedISO'];

/**
 * Loud banner when the server process is running older code than this page.
 *
 * index.html is read from disk on every load, but the server's TypeScript is
 * loaded once at startup — so an un-restarted server pairs a new page with an
 * old API, and new features look half-built with no error anywhere. Three
 * independent signals, any one of which is enough:
 *   - /api/health says codeStale: true (files on disk changed since startup)
 *   - /api/health has no codeStale at all (server predates this check)
 *   - task rows are missing fields this page expects
 */
function staleServerBanner() {
  const h = state.health;
  const reasons = [];
  if (h && h.codeStale === true) reasons.push('its source files have changed since it started');
  else if (h && h.codeStale === undefined) reasons.push('it is older than this page\'s version check');
  else if (h && h.codeStale === null) reasons.push('it could not verify its own code version');
  if (state.missingFields.size) reasons.push(`task rows arrived without: ${[...state.missingFields].join(', ')}`);
  if (!reasons.length) return '';

  return `<div class="ccc-warn" role="alert" style="border-color:var(--critical); background:var(--critical-wash); font-size:13px;">
    <span style="color:var(--critical)">⚠</span>
    <span><b>The dashboard server is running out-of-date code</b> — ${esc(reasons.join('; '))}.
    Parts of this page may be missing or wrong until it is restarted: stop it (Ctrl+C) and run <code>npm run dashboard</code>.
    ${h?.serverStartedAt ? `<span class="ccc-sub">Server started ${esc(fmtDate(h.serverStartedAt))}.</span>` : ''}</span>
  </div>`;
}

function render() {
  el('ccc-health').innerHTML = healthBar();
  el('ccc-tabs').innerHTML = TABS.map(t =>
    `<button class="ccc-tab" role="tab" aria-selected="${state.tab === t.id}" data-tab="${t.id}"><span class="ccc-tab-icon">${t.icon}</span>${esc(t.label)}</button>`).join('');

  let body;
  if (state.error) body = `<section class="ccc-card"><h2>Could not load</h2><p class="ccc-note ccc-note-bad">${esc(state.error)}</p>
    <p class="ccc-note">Task views read the Google Sheet directly — check that <code>service-account.json</code> exists and the Sheet is shared with it.</p></section>`;
  else if (state.loading && !state.data[state.tab]) body = `<section class="ccc-card"><div class="ccc-empty">Loading…</div></section>`;
  else if (state.tab === 'assistant') body = assistantView();
  else if (state.tab === 'directory') body = directoryView();
  else if (state.tab === 'monitor') body = monitorView();
  else body = taskView(state.tab);

  el('ccc-panel').innerHTML = staleServerBanner() + body;
  // The panel was just rebuilt, so the dropdown element is new and hidden.
  // Leaving ddOpen true would desync the state from the DOM.
  ddOpen = false;
  ddIndex = -1;
  ddItems = [];

  renderModals();
  renderChatWidget();
  restoreChatFocus();
}

/** Where the open detail modal was launched from — a board card or a summary widget. */
let detailOpenedFrom = '[data-board]';

/** Close the detail modal, and anything that only lived inside it. Returns the row key it was showing. */
function closeDetailModal() {
  const key = state.detailModal;
  state.detailModal = null;
  state.expanded = null;
  if (state.editingSurface === 'modal') {
    state.editingKey = null;
    state.editFormErrors = {};
    state.editFormNote = null;
  }
  return key;
}

/**
 * Esc and a backdrop click close the TOP modal only, one level at a time: a
 * delete-confirm opened from the detail modal goes back to that detail modal;
 * the detail modal goes back to the board. Dismissing the delete-confirm is
 * always Cancel — it can never delete — and it waits while a delete is in
 * flight. The staff-send review is deliberately NOT dismissible this way: it
 * holds hand-edited email text an accidental Esc would throw away; its own
 * Cancel/Done buttons stay the way out.
 */
function dismissTopModal() {
  if (state.deleteModal) {
    if (state.deleteModal.busy) return;
    state.deleteModal = null;
    render();
  } else if (state.detailModal) {
    const key = closeDetailModal();
    render();
    // Hand focus back to the card the modal was opened from.
    document.querySelector(`${detailOpenedFrom} [data-detail-open="${CSS.escape(key)}"]`)?.focus();
  }
}

/**
 * One owner for #ccc-modal-root. Every modal renders into the same element, so
 * exactly one is chosen here rather than each writing the root and wiping the
 * others (the Staff Send / delete collision). Delete takes precedence — it is
 * the one holding a destructive confirmation the operator is mid-way through
 * answering. A delete started from the detail modal REPLACES it on screen while
 * state.detailModal stays set, so Cancel lands back on the detail and a
 * successful delete clears both.
 */
function renderModals() {
  el('ccc-modal-root').innerHTML = deleteModalHtml() || staffSendModalHtml() || detailModalHtml();
}

// --- Directory autofill ----------------------------------------------------
// Once the user edits Email ID by hand, autofill stops overwriting it. Without
// this, correcting the email and then touching the name would silently revert it.
let emailManuallyEdited = false;

function setHint(fieldName, text, good) {
  const el = document.querySelector(`[data-hint-for="${fieldName}"]`);
  if (!el) return;
  el.textContent = text;
  el.className = `ccc-hint${good ? ' ccc-hint-good' : ''}`;
}

/**
 * The one autofill path. Typing and picking from the dropdown both call this, so
 * the matching rules cannot drift apart between the two entry points.
 */
function applyDirectoryAutofill(form, typedValue) {
  const emailInput = form.querySelector('[name="emailId"]');
  if (!emailInput) return;

  const match = findDirectoryByName(typedValue);

  if (match) {
    // Fill unless the user has taken over the field, or already typed something
    // different that isn't a previous autofill.
    if (!emailManuallyEdited) {
      emailInput.value = match.email;
      setHint('assignedTo', `Email ID auto-filled from Directory (${match.email}) — you can overwrite it`, true);
      // Clear any stale "email required" error styling now that it is populated.
      emailInput.closest('.ccc-field')?.setAttribute('data-invalid', 'false');
    } else {
      setHint('assignedTo', `${match.name} is in the Directory as ${match.email} — keeping the email you entered`, false);
    }
    return;
  }

  // No match: never clear what is already there. A half-typed name matching
  // nothing is the normal case, not an error.
  const dirCount = directoryEntries().length;
  setHint(
    'assignedTo',
    (typedValue || '').trim()
      ? 'No Directory match — enter the Email ID manually'
      : dirCount
        ? `${dirCount} name(s) in Directory — click to browse, Email ID fills in automatically`
        : 'Directory is empty — run npm run sync:directory to enable autofill',
    false
  );
}

// --- Assignee dropdown -----------------------------------------------------
// Deliberately opens on click/focus only. Reopening on every keystroke is what
// made the previous list feel intrusive, so once it is dismissed (Escape, a
// selection, or a click elsewhere) typing filters nothing back into view.
let ddOpen = false;
let ddIndex = -1;
let ddItems = [];
let ddSuppressOpen = false;

const ddList = () => document.getElementById('ccc-dd-list');
const ddInput = () => document.querySelector('[data-form="task"] [name="assignedTo"]');

function ddFilter(text) {
  const needle = (text || '').trim().toLowerCase();
  const all = directoryEntries();
  if (!needle) return all;
  return all.filter(e => e.name.toLowerCase().includes(needle) || e.email.toLowerCase().includes(needle));
}

function ddRender(filterText) {
  const list = ddList();
  if (!list) return;

  ddItems = ddFilter(filterText);
  ddIndex = -1;

  if (ddItems.length === 0) {
    list.innerHTML = `<div class="ccc-dd-empty">No Directory name matches “${esc((filterText || '').trim())}” — type the Email ID manually.</div>`;
    return;
  }

  list.innerHTML = ddItems
    .map(
      (e, i) =>
        `<div class="ccc-dd-opt" role="option" aria-selected="false" data-dd-index="${i}">
           <span class="ccc-dd-name">${esc(e.name)}</span>
           <span class="ccc-dd-email">${esc(e.email)}</span>
         </div>`
    )
    .join('');
}

function ddSetOpen(open, filterText) {
  const list = ddList();
  const input = ddInput();
  if (!list || !input) return;

  ddOpen = open;
  input.setAttribute('aria-expanded', String(open));

  if (open) {
    ddRender(filterText ?? input.value);
    list.hidden = false;
    list.scrollTop = 0;
  } else {
    list.hidden = true;
    ddIndex = -1;
  }
}

function ddHighlight(nextIndex) {
  const list = ddList();
  if (!list || ddItems.length === 0) return;

  // Wrap around, so ArrowUp from the top lands on the last entry.
  ddIndex = (nextIndex + ddItems.length) % ddItems.length;

  list.querySelectorAll('.ccc-dd-opt').forEach((opt, i) => {
    const active = i === ddIndex;
    opt.classList.toggle('ccc-dd-active', active);
    opt.setAttribute('aria-selected', String(active));
    // 'nearest' keeps the 7-row viewport steady instead of recentring on each move.
    if (active) opt.scrollIntoView({ block: 'nearest' });
  });
}

function ddSelect(entry) {
  const input = ddInput();
  const form = input?.closest('[data-form="task"]');
  if (!input || !form || !entry) return;

  input.value = entry.name;
  applyDirectoryAutofill(form, entry.name); // exact-match logic, unchanged
  ddSetOpen(false);

  // Return focus for continued typing, without the focusin handler taking that
  // as a fresh click and reopening the list we just closed.
  if (document.activeElement !== input) {
    ddSuppressOpen = true;
    input.focus();
    ddSuppressOpen = false;
  }
}

document.addEventListener('input', ev => {
  const input = ev.target;
  if (!input.name) return;
  const form = input.closest('[data-form="task"]');
  if (!form) return;

  // Typing directly into Email ID hands control to the user for good.
  if (input.name === 'emailId') {
    emailManuallyEdited = true;
    return;
  }

  if (input.name !== 'assignedTo') return;

  applyDirectoryAutofill(form, input.value);
  // Filter live, but only while the list is already showing — never force it open.
  if (ddOpen) ddRender(input.value);
});

// Open on click or focus (mouse and keyboard both land here).
document.addEventListener('focusin', ev => {
  if (ddSuppressOpen) return; // re-focusing after a selection must not reopen it
  if (ev.target.name === 'assignedTo' && ev.target.closest('[data-form="task"]')) ddSetOpen(true);
});

document.addEventListener('mousedown', ev => {
  // Selecting an option: mousedown beats the input's blur, so the click is never lost.
  const opt = ev.target.closest('.ccc-dd-opt');
  if (opt) {
    ev.preventDefault();
    ddSelect(ddItems[Number(opt.dataset.ddIndex)]);
    return;
  }
  if (ev.target.closest('[data-form="task"] [name="assignedTo"]')) {
    ddSetOpen(true);
    return;
  }
  // Anywhere else — including inside the list's scrollbar area — dismisses it.
  if (ddOpen && !ev.target.closest('#ccc-dd-list')) ddSetOpen(false);
});

document.addEventListener('keydown', ev => {
  const input = ev.target;
  if (input.name !== 'assignedTo' || !input.closest('[data-form="task"]')) return;

  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    if (!ddOpen) return ddSetOpen(true);
    ddHighlight(ddIndex + 1);
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (!ddOpen) return ddSetOpen(true);
    ddHighlight(ddIndex - 1);
  } else if (ev.key === 'Enter') {
    if (ddOpen && ddIndex >= 0) {
      ev.preventDefault(); // don't submit the form on a selection
      ddSelect(ddItems[ddIndex]);
    }
  } else if (ev.key === 'Escape') {
    if (ddOpen) {
      ev.stopPropagation();
      ddSetOpen(false);
    }
  } else if (ev.key === 'Tab') {
    ddSetOpen(false);
  }
});

// --- modal dismissal (Esc / backdrop) ----------------------------------------
// Where the press began: a click counts as a backdrop click only if the press
// started on the backdrop too (see the [data-dismiss] branch below).
let pressStartedOnBackdrop = false;
document.addEventListener('mousedown', ev => {
  pressStartedOnBackdrop = Boolean(ev.target.matches?.('[data-dismiss]'));
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || !(state.deleteModal || state.detailModal)) return;
  ev.preventDefault();
  dismissTopModal();
});

// --- events ----------------------------------------------------------------
document.addEventListener('click', async ev => {
  const t = ev.target.closest(
    '[data-tab],[data-subtab],[data-mis-tab],[data-expand],[data-refresh],[data-submit],[data-approve],' +
      '[data-staff-preview],[data-staff-confirm],[data-staff-cancel],[data-staff-close],[data-toggle-expired],' +
      '[data-edit-toggle],[data-edit-cancel],[data-toggle-reviewed],[data-mark-reviewed],[data-unreview],' +
      '[data-delete-task],[data-delete-confirm],[data-delete-cancel],' +
      '[data-detail-open],[data-detail-back],[data-dismiss],[data-goto-approvals]'
  );
  if (!t) return;

  // Backdrop click: only a click that both started AND ended on the backdrop
  // itself. A click inside the modal also bubbles up to here (the modal sits
  // inside its backdrop), and a drag that begins in an edit field and releases
  // outside must not throw the form away.
  if (t.dataset.dismiss !== undefined) {
    if (ev.target === t && pressStartedOnBackdrop) dismissTopModal();
    return;
  }

  if (t.dataset.gotoApprovals !== undefined) {
    closeDetailModal();
    state.tab = 'monitor'; state.monitorView = 'approvals'; state.formErrors = {}; state.formNote = null;
    return state.data.monitor ? render() : load('monitor');
  }

  if (t.dataset.detailOpen !== undefined) {
    closeDetailModal(); // start clean: no agent detail or edit form left over from another row
    // The same row can be opened from its card or from a summary widget; focus
    // goes back to whichever was clicked when the modal closes.
    detailOpenedFrom = t.closest('[data-tab-summary]') ? '[data-tab-summary]' : '[data-board]';
    state.detailModal = t.dataset.detailOpen;
    render();
    document.querySelector('[data-detail-back]')?.focus();
    return;
  }

  if (t.dataset.detailBack !== undefined) return dismissTopModal();

  // Switching register re-reads that tab. The server memoises the Sheet for 15s,
  // so flipping back and forth costs nothing.
  if (t.dataset.misTab) {
    if (state.misTab === t.dataset.misTab) return;
    state.misTab = t.dataset.misTab;
    return load('mis');
  }

  if (t.dataset.toggleExpired !== undefined) {
    state.showExpiredApprovals = !state.showExpiredApprovals;
    return render();
  }

  if (t.dataset.toggleReviewed !== undefined) {
    const id = t.dataset.toggleReviewed;
    state.showReviewed[id] = !state.showReviewed[id];
    return render();
  }

  if (t.dataset.editToggle !== undefined) {
    const key = t.dataset.editToggle;
    // Same row + same place = close; anywhere else = open it there instead.
    const surface = t.dataset.editSurface || 'modal';
    state.editingKey = state.editingKey === key && state.editingSurface === surface ? null : key;
    state.editingSurface = surface;
    state.editFormErrors = {};
    state.editFormNote = null;
    return render();
  }

  if (t.dataset.editCancel !== undefined) {
    state.editingKey = null;
    state.editFormErrors = {};
    state.editFormNote = null;
    return render();
  }

  // Opens the confirm modal only — this click never deletes anything.
  if (t.dataset.deleteTask !== undefined) {
    const [tabName, rowIndexStr] = t.dataset.deleteTask.split('|');
    const rowIndex = Number(rowIndexStr);
    const task = (state.data[state.tab]?.tasks || []).find(x => x.tabName === tabName && x.rowIndex === rowIndex);
    if (!task) return;
    state.deleteModal = {
      tabName, rowIndex,
      taskDescription: task.taskDescription,
      assignedTo: task.assignedTo,
      emailId: task.emailId,
      busy: false, error: null,
    };
    return render();
  }

  if (t.dataset.deleteCancel !== undefined) {
    state.deleteModal = null;
    return render();
  }

  if (t.dataset.deleteConfirm !== undefined) {
    const d = state.deleteModal;
    if (!d || d.busy) return;
    d.busy = true;
    d.error = null;
    render();
    try {
      // The description/email travel with the request so the server can prove
      // the row it is about to delete is still the row shown in this modal.
      const res = await api('/api/tasks/delete', {
        method: 'POST',
        body: JSON.stringify({
          tab: d.tabName,
          rowIndex: d.rowIndex,
          expectedTaskDescription: d.taskDescription,
          expectedEmailId: d.emailId,
        }),
      });
      state.deleteModal = null;
      // The row is gone, so the detail modal it may have been opened from goes too.
      closeDetailModal();
      // Row numbers just shifted, and all of these are keyed by row index.
      state.staffSend.selected = new Set();
      state.expanded = null;
      state.editingKey = null;
      state.reviewedBusy = {};
      state.formNote = res.error
        ? { ok: false, text: res.error }
        : { ok: true, text: `Deleted row ${d.rowIndex} from ${d.tabName}.` };
      await load(state.tab, { refresh: true });
    } catch (err) {
      // 409 (pending approval or a changed row), 403, 503 and 500 all land here
      // and are shown in the modal the operator is already looking at.
      d.busy = false;
      d.error = err.body?.error || err.message;
      render();
    }
    return;
  }

  if (t.dataset.markReviewed !== undefined || t.dataset.unreview !== undefined) {
    const key = t.dataset.markReviewed !== undefined ? t.dataset.markReviewed : t.dataset.unreview;
    const reviewed = t.dataset.markReviewed !== undefined;
    const [tabName, rowIndexStr] = key.split('|');
    state.reviewedBusy[key] = true;
    render();
    try {
      await api('/api/tasks/reviewed', {
        method: 'POST',
        body: JSON.stringify({ tab: tabName, rowIndex: Number(rowIndexStr), reviewed }),
      });
      delete state.reviewedBusy[key];
      // A reviewed row leaves the board, so its detail modal closes with it.
      if (state.detailModal === key) closeDetailModal();
      await load(state.tab); // re-renders with the row moved to/from Reviewed
    } catch (err) {
      console.error('Mark reviewed failed:', err.message);
      delete state.reviewedBusy[key];
      render();
    }
    return;
  }

  if (t.dataset.tab && t.classList.contains('ccc-tab')) {
    state.tab = t.dataset.tab; state.formErrors = {}; state.formNote = null;
    emailManuallyEdited = false; // fresh form, autofill active again
    if (!state.data[state.tab]) return load(state.tab);
    return render();
  }
  if (t.dataset.subtab) { state.monitorView = t.dataset.subtab; return render(); }
  if (t.dataset.expand) {
    state.expanded = state.expanded === t.dataset.expand ? null : t.dataset.expand;
    return render();
  }
  if (t.dataset.refresh) return load(t.dataset.refresh, { refresh: true });

  if (t.dataset.submit === 'task') {
    const form = document.querySelector('[data-form="task"]');
    const payload = Object.fromEntries(new FormData(form));
    // MIS submits the EXACT currently-selected register (state.misTab), not a loose
    // hint — resolveTab() only exact-matches CONFIG.REPORT_SOURCES tab names, and a
    // substring hint like "mis" would fall through to Staff Tracker instead.
    payload.tab = t.dataset.tab === 'mis' ? state.misTab : t.dataset.tab === 'report' ? 'Report Calendar' : 'Staff Tracker';
    t.disabled = true;
    try {
      const res = await api('/api/tasks', { method: 'POST', body: JSON.stringify(payload) });
      state.formErrors = {};
      const notifyNote = res.notified ? ' Assignee notified.' : res.notifyError ? ` (Notification failed: ${res.notifyError})` : '';
      state.formNote = { ok: true, text: `Added to ${res.task.tabName} at row ${res.task.rowIndex}.${notifyNote}${res.dbWarning ? ' (Sheet written; DB mirror skipped.)' : ''}` };
      emailManuallyEdited = false; // form is cleared on reload; re-arm autofill
      await load(t.dataset.tab, { refresh: true });
    } catch (err) {
      state.formErrors = err.body?.errors || {};
      state.formNote = { ok: false, text: Object.keys(state.formErrors).length ? 'Fix the highlighted fields.' : err.message };
      render();
    }
    return;
  }

  if (t.dataset.submit === 'edit') {
    const form = document.querySelector('[data-form="edit"]');
    const payload = Object.fromEntries(new FormData(form));
    const [tabName, rowIndexStr] = state.editingKey.split('|');
    payload.tab = tabName;
    payload.rowIndex = Number(rowIndexStr);
    t.disabled = true;
    try {
      await api('/api/tasks/edit', { method: 'POST', body: JSON.stringify(payload) });
      state.editFormErrors = {};
      state.editFormNote = null;
      state.editingKey = null; // close the form on success
      await load(state.tab, { refresh: true }); // Sheet changed — bypass the 15s cache
    } catch (err) {
      state.editFormErrors = err.body?.errors || {};
      state.editFormNote = { ok: false, text: Object.keys(state.editFormErrors).length ? 'Fix the highlighted fields.' : err.message };
      render();
    }
    return;
  }

  if (t.dataset.submit === 'directory') {
    const form = document.querySelector('[data-form="directory"]');
    const payload = Object.fromEntries(new FormData(form));
    t.disabled = true;
    try {
      await api('/api/directory', { method: 'POST', body: JSON.stringify(payload) });
      state.formErrors = {}; state.formNote = { ok: true, text: `Saved ${payload.email}.` };
      await load('directory');
    } catch (err) {
      state.formErrors = err.body?.errors || {};
      state.formNote = { ok: false, text: Object.keys(state.formErrors).length ? 'Fix the highlighted fields.' : err.message };
      render();
    }
    return;
  }

  if (t.dataset.approve) {
    const runId = t.dataset.approve;
    state.approving[runId] = 'busy'; render();
    try {
      const res = await api(`/api/approvals/${encodeURIComponent(runId)}/approve`, { method: 'POST', body: '{}' });
      state.approving[runId] = res.message;
    } catch (err) {
      state.approving[runId] = err.body?.message || err.message;
    }
    await load('monitor');
    return;
  }

  if (t.dataset.staffPreview !== undefined) {
    const rowIndexes = [...state.staffSend.selected];
    t.disabled = true;
    try {
      const res = await api('/api/staff-reminders/preview', { method: 'POST', body: JSON.stringify({ rowIndexes }) });
      state.staffSend.previews = res.previews;
      state.staffSend.skipped = res.skipped || [];
      state.staffSend.result = null;
    } catch (err) {
      state.staffSend.previews = [];
      state.staffSend.skipped = [{ rowIndex: 0, reason: err.message }];
    }
    render();
    return;
  }

  if (t.dataset.staffCancel !== undefined) {
    state.staffSend.previews = null;
    state.staffSend.skipped = [];
    state.staffSend.result = null;
    render();
    return;
  }

  if (t.dataset.staffClose !== undefined) {
    // Clear the selection too — the sent rows are done; re-select explicitly
    // for anything still needing attention next time.
    state.staffSend.selected = new Set();
    state.staffSend.previews = null;
    state.staffSend.skipped = [];
    state.staffSend.result = null;
    await load('staff', { refresh: true }); // Mail Sent column reflects the new log rows
    return;
  }

  if (t.dataset.staffConfirm !== undefined) {
    state.staffSend.sending = true;
    render();
    // One entry per DIGEST (per recipient), carrying every row it covers so the
    // server can log an occurrence against each of them.
    const items = state.staffSend.previews.map(p => ({
      rowIndexes: p.rowIndexes,
      recipientEmail: p.recipientEmail,
      subject: p.subject,
      body: p.body,
      reminderType: p.reminderType,
    }));
    try {
      const res = await api('/api/staff-reminders/send', { method: 'POST', body: JSON.stringify({ items }) });
      state.staffSend.result = res;
    } catch (err) {
      state.staffSend.result = { sentCount: 0, failedCount: items.length, results: items.map(i => ({ rowIndex: i.rowIndex, sent: false, error: err.message })) };
    }
    state.staffSend.sending = false;
    render();
    return;
  }
});

// Checkbox selection (Staff Tracker rows) and in-place preview editing both use
// the same delegated `change`/`input` listener — neither needs a full re-render,
// since editing a textarea while the whole modal re-renders would fight the
// cursor position.
document.addEventListener('change', async ev => {
  const cb = ev.target.closest('[data-staff-select]');
  if (cb) {
    const rowIndex = Number(cb.dataset.staffSelect);
    if (cb.checked) state.staffSend.selected.add(rowIndex);
    else state.staffSend.selected.delete(rowIndex);
    render();
    return;
  }

  const sel = ev.target.closest('[data-tasktype-select]');
  if (sel) {
    const [tabName, rowIndexStr] = sel.dataset.tasktypeSelect.split('|');
    const rowIndex = Number(rowIndexStr);
    const key = `${tabName}|${rowIndex}`;
    const newTaskType = sel.value;

    state.taskTypeEditing[key] = 'busy';
    render();

    try {
      const res = await api('/api/tasks/task-type', {
        method: 'POST',
        body: JSON.stringify({ tab: tabName, rowIndex, taskType: newTaskType }),
      });
      const rv = res.reevaluation || {};
      const message = rv.attempted
        ? rv.message
        : rv.reason
          ? `Task Type saved. ${rv.reason}`
          : 'Task Type saved.';
      state.taskTypeEditing[key] = { ok: true, message };
      // Re-read from the Sheet so Status/Remarks/category reflect anything the
      // re-evaluation just wrote back, not only the Task Type cell itself.
      await load(state.tab, { refresh: true });
    } catch (err) {
      // Sheet write failed (or the row vanished) — the select still shows the
      // OLD value on the next render because the re-read never used the new
      // one; nothing here writes an unconfirmed value into local state.
      state.taskTypeEditing[key] = { ok: false, message: `Not saved: ${err.body?.error || err.message}` };
      render();
    }
  }
});

document.addEventListener('input', ev => {
  const subjectIdx = ev.target.dataset.previewSubject;
  const bodyIdx = ev.target.dataset.previewBody;
  if (subjectIdx !== undefined && state.staffSend.previews) {
    state.staffSend.previews[Number(subjectIdx)].subject = ev.target.value;
  } else if (bodyIdx !== undefined && state.staffSend.previews) {
    state.staffSend.previews[Number(bodyIdx)].body = ev.target.value;
  }
  // No render() here — these inputs already reflect the keystroke; re-rendering
  // the whole modal would rebuild the textarea and jump the cursor to the end.
});

// --- AI Assistant events ----------------------------------------------------
// Delegated, like every other handler here: the composer lives inside markup
// render() rebuilds, so a directly-bound listener would die on the first render.

document.addEventListener('click', ev => {
  const toggle = ev.target.closest('[data-chat-toggle]');
  if (toggle) {
    state.chat.widgetOpen = !state.chat.widgetOpen;
    if (state.chat.widgetOpen) { state.chat.focus = 'widget'; loadChatHistory(); }
    render(); // render() restores focus and scroll for whichever composer is now live
    return;
  }

  if (ev.target.closest('[data-chat-close]')) {
    state.chat.widgetOpen = false;
    render();
    return;
  }

  const suggest = ev.target.closest('[data-chat-suggest]');
  if (suggest) {
    state.chat.focus = suggest.closest('.ccc-widget') ? 'widget' : 'tab';
    sendChat(suggest.dataset.chatSuggest);
  }
});

document.addEventListener('submit', ev => {
  const form = ev.target.closest('[data-chat-form]');
  if (!form) return;
  ev.preventDefault();
  const key = form.dataset.chatForm;
  state.chat.focus = key;
  sendChat(form.querySelector('[data-chat-input]')?.value);
});

// Draft is mirrored into state so switching between the tab and the widget (or
// any re-render) doesn't discard a half-typed question.
document.addEventListener('input', ev => {
  const box = ev.target.closest('[data-chat-input]');
  if (!box) return;
  state.chat.draft = box.value;
  state.chat.focus = box.dataset.chatInput;
  // No render() — the textarea already shows the keystroke, and rebuilding it
  // would move the caret to the end mid-sentence.
});

// Enter sends, Shift+Enter breaks the line — a textarea, not an input, precisely
// so a long question can be composed over several lines.
document.addEventListener('keydown', ev => {
  const box = ev.target.closest('[data-chat-input]');
  if (!box || ev.key !== 'Enter' || ev.shiftKey) return;
  ev.preventDefault();
  state.chat.focus = box.dataset.chatInput;
  sendChat(box.value);
});

// --- boot ------------------------------------------------------------------
state.health = await api('/api/health').catch(() => null);
state.taskTypeOptions = (await api('/api/task-types').catch(() => ({ options: [] }))).options;
// First configured MIS register is the default view of the combined tab. The list
// comes from CONFIG.REPORT_SOURCES via /api/health, so it is never hardcoded here.
state.misTab = state.health?.misSources?.[0]?.tab || null;
await load(state.tab);
</script>
</body>
</html>
