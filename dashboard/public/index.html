<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CFO Command Centre</title>
<style>
  /* ---------- tokens ---------- */
  :root {
    color-scheme: light;
    --plane:        #f6f7f8;
    --surface:      #ffffff;
    --surface-2:    #fafbfb;
    --ink:          #14181f;
    --ink-2:        #565d6b;
    --ink-muted:    #8a919e;
    --hairline:     #e5e7eb;
    --border-strong:#d7dade;
    --accent:       #2563eb;
    --accent-wash:  #eaf1fe;
    --good:         #16a34a;
    --good-wash:    #eafaf0;
    --warning:      #d97706;
    --warning-wash: #fdf3e6;
    --serious:      #c2410c;
    --serious-wash: #fdece0;
    --critical:     #dc2626;
    --critical-wash:#fdeceb;
    --wash:         rgba(20,24,31,0.035);
    --shadow-sm: 0 1px 2px rgba(20,24,31,0.05);
    --shadow-md: 0 4px 16px rgba(20,24,31,0.08);
    /* Kanban cards: a touch more lift than shadow-sm so stacked cards separate. */
    --shadow-card: 0 1px 2px rgba(20,24,31,0.06), 0 2px 8px rgba(20,24,31,0.06);
    /* Kanban layers, mixed from the tokens above (no new colours). Light: the
       column is a well slightly darker than the page, cards sit in it in white.
       Dark overrides below go the other way — each layer lighter than the one
       behind it — because a darker well on a dark page reads as a hole. */
    --kanban-col: color-mix(in srgb, var(--plane), var(--ink) 4%);
    --kanban-card: var(--surface);
    /* One page width for the shell, top nav and tab bar, so their edges line up. */
    --page-max: 1920px;
    --shadow-lg: 0 16px 48px rgba(20,24,31,0.18);
    --radius: 10px;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0e1013; --surface: #16181c; --surface-2: #1b1e23; --ink: #f2f3f5;
      --ink-2: #a8adb8; --ink-muted: #74798a; --hairline: #262a31; --border-strong: #33373f;
      --accent: #5b9bf7; --accent-wash: #16233a;
      --good: #34c26b; --good-wash: #12271a;
      --warning: #eab04a; --warning-wash: #2c2211;
      --serious: #e08a4d; --serious-wash: #2c1e11;
      --critical: #ef5a56; --critical-wash: #2c1614;
      --wash: rgba(255,255,255,0.05);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4); --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
      --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.45);
      --kanban-col: var(--surface-2); --kanban-card: color-mix(in srgb, var(--surface-2), var(--ink) 5%);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0e1013; --surface: #16181c; --surface-2: #1b1e23; --ink: #f2f3f5;
    --ink-2: #a8adb8; --ink-muted: #74798a; --hairline: #262a31; --border-strong: #33373f;
    --accent: #5b9bf7; --accent-wash: #16233a;
    --good: #34c26b; --good-wash: #12271a;
    --warning: #eab04a; --warning-wash: #2c2211;
    --serious: #e08a4d; --serious-wash: #2c1e11;
    --critical: #ef5a56; --critical-wash: #2c1614;
    --wash: rgba(255,255,255,0.05);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4); --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
      --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.45);
      --kanban-col: var(--surface-2); --kanban-card: color-mix(in srgb, var(--surface-2), var(--ink) 5%);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--sans); font-weight: 650; margin: 0; letter-spacing: -0.015em; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }

  /* ---------- top nav ---------- */
  .ccc-topnav { background: var(--surface); border-bottom: 1px solid var(--hairline); position: sticky; top: 0; z-index: 40; }
  .ccc-topnav-inner { max-width: var(--page-max); margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
  .ccc-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  .ccc-brand .ccc-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--plane); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
  .ccc-search { flex: 1; max-width: 420px; position: relative; }
  .ccc-search input { width: 100%; font: inherit; font-size: 13px; padding: 8px 12px 8px 32px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink); }
  .ccc-search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
  .ccc-search input::placeholder { color: var(--ink-muted); }
  .ccc-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); font-size: 13px; pointer-events: none; }
  .ccc-theme-toggle { display: inline-flex; align-items: center; gap: 6px; appearance: none; border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink-2); padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
  .ccc-theme-toggle:hover { color: var(--ink); border-color: var(--border-strong); }

  /* ---------- shell ---------- */
  .ccc-shell { max-width: var(--page-max); margin: 0 auto; padding: 24px 24px 64px; }
  .ccc-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .ccc-chip { font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--hairline); color: var(--ink-2); background: var(--surface-2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .ccc-chip b { font-weight: 600; color: var(--ink); }
  .ccc-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }

  /* ---------- tab bar (Linear-style animated underline) ---------- */
  .ccc-tabbar-wrap { background: var(--surface); border-bottom: 1px solid var(--hairline); position: sticky; top: 49px; z-index: 39; }
  .ccc-tabs { max-width: var(--page-max); margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; }
  .ccc-tab { appearance: none; background: none; border: 0; position: relative; padding: 12px 4px; margin: 0 12px; color: var(--ink-muted); font-size: 13.5px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; transition: color 0.15s ease; }
  .ccc-tab:first-child { margin-left: 0; }
  .ccc-tab:hover { color: var(--ink); }
  .ccc-tab-icon { font-size: 13px; opacity: 0.85; }
  .ccc-tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; transform: scaleX(0); transition: transform 0.18s cubic-bezier(.4,0,.2,1); }
  .ccc-tab[aria-selected="true"] { color: var(--ink); font-weight: 650; }
  .ccc-tab[aria-selected="true"]::after { transform: scaleX(1); }

  .ccc-panel { margin-top: 24px; }
  .ccc-pagehead { margin-bottom: 20px; }
  .ccc-pagehead h1 { font-size: 22px; margin-bottom: 3px; }
  .ccc-pagehead p { margin: 0; color: var(--ink-2); font-size: 13px; }

  .ccc-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; box-shadow: var(--shadow-sm); padding: 20px 22px; margin-bottom: 18px; }
  .ccc-card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .ccc-card h2 { font-size: 17px; }
  .ccc-card h3 { font-size: 15.5px; }
  .ccc-card header p { margin: 2px 0 0; color: var(--ink-muted); font-size: 12.5px; }

  /* ---------- table ---------- */
  .ccc-scroll { overflow-x: auto; overflow-y: auto; max-height: 68vh; border-radius: 10px; border: 1px solid var(--hairline); }
  table.ccc-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; background: var(--surface); }
  .ccc-table th { position: sticky; top: 0; z-index: 5; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); font-weight: 650; padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  .ccc-table td { padding: 14px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  .ccc-table tbody tr:last-child td { border-bottom: 0; }
  .ccc-table tbody tr:nth-child(even) { background: var(--surface-2); }
  .ccc-table tbody tr { transition: background 0.1s ease; }
  .ccc-table tbody tr:hover { background: var(--accent-wash); }
  .ccc-table td.ccc-num, .ccc-table th.ccc-num { text-align: right; font-variant-numeric: tabular-nums; }
  .ccc-table .ccc-primary { color: var(--ink); font-weight: 550; }
  .ccc-table .ccc-sub { color: var(--ink-muted); font-size: 12px; margin-top: 1px; }
  .ccc-empty { padding: 28px 4px; color: var(--ink-2); font-size: 13px; }
  .ccc-empty code { background: var(--wash); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* ---------- badges / status pills: dot + icon + label, never colour alone ---------- */
  .ccc-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; color: var(--ink); }
  .ccc-pdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ccc-badge .ccc-icon { font-size: 10px; line-height: 1; }
  .ccc-cat-received  { background: var(--good-wash); color: var(--good); }
  .ccc-cat-early     { background: var(--good-wash); color: var(--good); }
  .ccc-cat-unclear   { background: var(--warning-wash); color: var(--warning); }
  .ccc-cat-overdue   { background: var(--critical-wash); color: var(--critical); }
  .ccc-cat-pending   { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--hairline); }
  .ccc-cat-attention { background: var(--serious-wash); color: var(--serious); }
  .ccc-badge-PENDING  { background: var(--warning-wash); color: var(--warning); }
  .ccc-badge-APPROVED { background: var(--good-wash); color: var(--good); }
  .ccc-badge-EXPIRED  { background: var(--critical-wash); color: var(--critical); }
  .ccc-badge-RESENT   { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--hairline); }
  .ccc-badge-SENT     { background: var(--accent-wash); color: var(--accent); }
  .ccc-badge-DRAFTED  { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--hairline); }
  .ccc-badge-SKIPPED  { background: var(--serious-wash); color: var(--serious); }

  /* ---------- stacked stat bar (Employee Monitor "mix") ---------- */
  .ccc-bar { display: flex; gap: 2px; height: 8px; min-width: 120px; border-radius: 4px; overflow: hidden; }
  .ccc-bar span { height: 100%; }
  .ccc-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .ccc-legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* ---------- forms ---------- */
  .ccc-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .ccc-field { display: flex; flex-direction: column; gap: 6px; }
  .ccc-field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); font-weight: 650; }
  .ccc-field input, .ccc-field select { font: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink); width: 100%; }
  .ccc-field input:focus, .ccc-field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
  .ccc-field .ccc-error { color: var(--critical); font-size: 12px; font-weight: 500; }
  .ccc-hint { color: var(--ink-muted); font-size: 11.5px; min-height: 1em; }
  .ccc-hint-good { color: var(--good); font-weight: 500; }

  /* Assignee dropdown. Exactly 7 rows are visible; the rest are reached by
     scrolling inside the list, never by the list growing. Row height is fixed so
     "7 rows" is a real measurement rather than an approximation. */
  .ccc-dd-wrap { position: relative; }
  .ccc-dd {
    --ccc-dd-row: 38px;
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px;
    box-shadow: var(--shadow-lg);
    max-height: calc(7 * var(--ccc-dd-row));
    overflow-y: auto; overscroll-behavior: contain;
  }
  .ccc-dd[hidden] { display: none; }
  .ccc-dd-opt {
    height: var(--ccc-dd-row); box-sizing: border-box;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--hairline);
  }
  .ccc-dd-opt:last-child { border-bottom: 0; }
  .ccc-dd-opt:hover, .ccc-dd-opt.ccc-dd-active { background: var(--accent-wash); }
  .ccc-dd-name { color: var(--ink); font-weight: 550; white-space: nowrap; }
  .ccc-dd-email { color: var(--ink-muted); font-size: 11.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ccc-dd-empty { padding: 12px; color: var(--ink-2); font-size: 12.5px; }

  .ccc-tasktype-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .ccc-tasktype-select { font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink-2); }
  .ccc-tasktype-select:disabled { opacity: 0.6; }


  /* ---------- AI Assistant ---------- */
  /* One set of bubble/composer rules serves both the full tab and the floating
     widget — the widget only constrains the height, so the two can never drift
     into looking like different products. */
  .ccc-chat { display: flex; flex-direction: column; gap: 14px; }
  .ccc-chat-log { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 4px 2px; }
  .ccc-chat-tab .ccc-chat-log { min-height: 46vh; max-height: 58vh; }
  .ccc-msg { display: flex; flex-direction: column; max-width: 78%; gap: 3px; }
  .ccc-msg-user { align-self: flex-end; align-items: flex-end; }
  .ccc-msg-assistant { align-self: flex-start; align-items: flex-start; }
  /* pre-wrap, not <br> substitution: replies are plain text by instruction, and
     pre-wrap preserves their paragraph breaks without any markup being injected
     into the escaped string. */
  .ccc-bubble { padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--hairline); }
  .ccc-msg-user .ccc-bubble { background: var(--accent); border-color: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .ccc-msg-assistant .ccc-bubble { background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 4px; }
  .ccc-msg-time { font-size: 11px; color: var(--ink-muted); padding: 0 4px; }
  .ccc-chat-composer { display: flex; gap: 8px; align-items: flex-end; }
  .ccc-chat-input { flex: 1; font: inherit; font-size: 13.5px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink); resize: none; line-height: 1.5; max-height: 120px; }
  .ccc-chat-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
  .ccc-suggests { display: flex; flex-wrap: wrap; gap: 8px; }
  .ccc-suggest { appearance: none; text-align: left; border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink-2); padding: 8px 12px; border-radius: 999px; font-size: 12.5px; }
  .ccc-suggest:hover { color: var(--ink); border-color: var(--accent); background: var(--accent-wash); }
  /* Three dots, staggered — a spinner would not say "it is composing an answer". */
  .ccc-typing { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
  .ccc-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-muted); display: block; animation: ccc-blink 1.2s infinite ease-in-out; }
  .ccc-typing i:nth-child(2) { animation-delay: 0.18s; }
  .ccc-typing i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes ccc-blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ccc-typing i { animation: none; opacity: 0.6; } }

  /* ---------- floating chat widget ---------- */
  .ccc-fab { position: fixed; right: 22px; bottom: 22px; z-index: 60; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--hairline); background: var(--accent); color: #fff; font-size: 21px; box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; }
  .ccc-fab:hover { box-shadow: var(--shadow-lg); }
  .ccc-widget { position: fixed; right: 22px; bottom: 84px; z-index: 60; width: 400px; height: 500px; max-width: calc(100vw - 32px); max-height: calc(100vh - 120px); background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; animation: ccc-slideup 0.18s cubic-bezier(.4,0,.2,1); }
  @keyframes ccc-slideup { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ccc-widget { animation: none; } }
  .ccc-widget-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); background: var(--surface-2); }
  .ccc-widget-head b { font-size: 13.5px; }
  .ccc-widget-close { appearance: none; border: 0; background: none; color: var(--ink-muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .ccc-widget-close:hover { color: var(--ink); background: var(--wash); }
  .ccc-widget .ccc-chat { flex: 1; min-height: 0; padding: 12px 14px 14px; gap: 10px; }
  .ccc-widget .ccc-chat-log { flex: 1; min-height: 0; }
  .ccc-widget .ccc-msg { max-width: 88%; }
  .ccc-widget .ccc-bubble { font-size: 13px; padding: 8px 12px; }

  .ccc-modal-backdrop { position: fixed; inset: 0; background: rgba(15,17,21,0.5); backdrop-filter: blur(1px); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
  .ccc-modal { background: var(--surface); border-radius: 14px; padding: 26px 28px 22px; width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); }
  .ccc-modal-wide { max-width: 780px; }
  .ccc-modal h2 { font-size: 18px; margin-bottom: 6px; }
  .ccc-preview-item { border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; margin: 14px 0; background: var(--surface-2); }
  .ccc-preview-head { font-size: 13px; margin-bottom: 10px; }
  .ccc-field-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); font-weight: 650; margin: 10px 0 4px; }
  .ccc-preview-subject { width: 100%; font: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); box-sizing: border-box; }
  .ccc-preview-body { width: 100%; font: inherit; font-size: 12.5px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); box-sizing: border-box; resize: vertical; }
  .ccc-field[data-invalid="true"] input { border-color: var(--critical); }
  .ccc-actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline); flex-wrap: wrap; }
  .ccc-btn { display: inline-flex; align-items: center; gap: 6px; appearance: none; border: 1px solid var(--border-strong); background: var(--ink); color: var(--plane); padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-sm); transition: opacity 0.12s ease; }
  .ccc-btn:hover:not(:disabled) { opacity: 0.88; }
  .ccc-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ccc-btn-ghost { background: var(--surface); color: var(--ink); }
  .ccc-note { font-size: 12.5px; color: var(--ink-2); }
  .ccc-note-good { color: var(--good); font-weight: 600; }
  .ccc-note-bad { color: var(--critical); font-weight: 600; }
  .ccc-action-cell { min-width: 150px; }
  .ccc-action-cell .ccc-note { display: inline-block; max-width: 260px; font-weight: 500; }
  .ccc-card-muted { opacity: 0.85; }
  .ccc-card-muted .ccc-table { font-size: 12.5px; }

  .ccc-warn { display: flex; gap: 9px; align-items: flex-start; background: var(--serious-wash); border: 1px solid var(--serious); border-radius: 8px; padding: 10px 13px; font-size: 12.5px; color: var(--ink); margin-bottom: 16px; }
  .ccc-expand { appearance: none; background: none; border: 0; color: var(--accent); padding: 0; font-size: 12.5px; font-weight: 600; }
  .ccc-expand:hover { text-decoration: underline; }
  .ccc-detail { background: var(--wash); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; white-space: pre-wrap; line-height: 1.7; }
  .ccc-detail b { color: var(--ink); }
  .ccc-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .ccc-link:hover { text-decoration-thickness: 2px; }
  .ccc-attach { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--hairline); background: var(--surface); color: var(--accent); font-size: 12px; text-decoration: none; }
  .ccc-attach:hover { background: var(--wash); text-decoration: underline; }
  .ccc-mail-sent   { background: var(--accent-wash); color: var(--accent); }
  .ccc-mail-draft  { background: var(--warning-wash); color: var(--warning); }
  .ccc-mail-failed { background: var(--critical-wash); color: var(--critical); }
  .ccc-mail-none   { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--hairline); }
  .ccc-chronic { color: var(--critical); font-weight: 600; }
  .ccc-subtabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .ccc-subtab { appearance: none; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 550; }
  .ccc-subtab[aria-selected="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); font-weight: 650; }

  /* ---------- Kanban board (task tabs) ---------- */
  /* Cover cards fill their column; the column width moves within a range and
     the board is centred, so spare page width becomes outer margin rather than
     ever-wider cards. Below five minimum-width columns the board scrolls
     sideways instead of squeezing them.
     Range measured on every real cover (183 cards): at 260–300px wide a cover
     settles at ~250px tall (90% within 206–269px); under ~210px titles and the
     "Name (email)" line start wrapping and it grows. A column is its cover plus
     45px (28px padding, 15px scrollbar gutter, 2px border), so 255–345px gives
     210–300px covers: five fit at 1440px, and at 1920px the board centres. */
  .ccc-board { display: grid; grid-template-columns: repeat(5, minmax(255px, 345px)); gap: 16px; align-items: start; width: max-content; max-width: 100%; margin-inline: auto; overflow-x: auto; padding-bottom: 4px; }
  .ccc-col { background: var(--kanban-col); border: 1px solid var(--hairline); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; }
  .ccc-col-head { border-bottom: 1px solid var(--hairline); padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
  .ccc-col-rail { width: 3px; align-self: stretch; border-radius: 2px; background: var(--col); flex: none; }
  .ccc-col-head h3 { font-size: 13.5px; }
  .ccc-col-count { margin-left: auto; font-size: 12px; font-weight: 650; color: var(--ink-2); background: var(--surface); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
  /* scrollbar-gutter: every column reserves the same scrollbar room, scrolling
     or not, so a long column never ends up narrower than its neighbours. */
  .ccc-col-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; max-height: 72vh; overflow-y: auto; scrollbar-gutter: stable; }
  .ccc-col-empty { color: var(--ink-muted); font-size: 12.5px; padding: 18px 6px; text-align: center; }
  /* overflow:hidden is only there so the radius clips the status strip, and it
     must never clip content: overflow-wrap wraps long remarks, ids and
     filenames inside the card, and flex-shrink:0 stops the scrolling column
     from squashing cards to fit — overflow:hidden drops the flex item's
     automatic min-height, and without this a long column crushed its cards
     to ~34px and cut their contents off.
     No forced size: a cover carries the same few lines on every card, so its
     natural size is already uniform. */
  .ccc-kcard { position: relative; overflow: hidden; overflow-wrap: anywhere; flex-shrink: 0; display: flex; flex-direction: column; background: var(--kanban-card); border: 0.5px solid var(--border-strong); border-radius: 12px; padding: 16px 16px 16px 20px; box-shadow: var(--shadow-card); font-size: 12.5px; min-width: 0; }
  /* Status strip: a bar inside the card, clipped by the card's own radius — a
     border-left on a rounded box leaves a square corner poking out. --col is
     the card's category colour, the same one its status pill uses. */
  .ccc-kcard::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 4px; background: var(--col); }
  .ccc-kcard-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .ccc-kcard-row { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-muted); background: var(--wash); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .ccc-kcard-title { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
  .ccc-kcard-meta { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; color: var(--ink-2); overflow-wrap: anywhere; }
  .ccc-kcard-status { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 12px; }
  .ccc-kcard-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hairline); }
  .ccc-k { color: var(--ink-muted); }
  /* ---------- card detail modal ---------- */
  .ccc-dm-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .ccc-dm-col { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .ccc-dm-back { margin-left: auto; }
  .ccc-dm-grid { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px 18px; margin-top: 16px; font-size: 13px; align-items: start; overflow-wrap: anywhere; }
  .ccc-dm-k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); font-weight: 650; padding-top: 3px; }
  @media (max-width: 560px) { .ccc-dm-grid { grid-template-columns: 1fr; gap: 4px; } .ccc-dm-v { margin-bottom: 10px; } }

  /* ---------- status donut (replaces the stat cards) ---------- */
  /* Donut · legend · 2x2 summary grid. The grid takes the blank space to the
     right, and drops under the donut when less than ~520px is left. */
  .ccc-donut-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
  .ccc-donut-row > .ccc-donut-wrap { flex: 0 0 220px; }
  .ccc-donut-row > .ccc-dlegend { flex: 1 1 280px; }
  .ccc-sumgrid { flex: 1 1 520px; align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .ccc-donut-row > .ccc-donut-wrap { flex-basis: 100%; } .ccc-sumgrid { grid-template-columns: 1fr; } }
  /* Summary panels wear the Kanban tokens: column tint, 0.5px border, 12px corners. */
  .ccc-mini { background: var(--kanban-col); border: 0.5px solid var(--border-strong); border-radius: 12px; padding: 12px 14px; min-width: 0; overflow-wrap: anywhere; }
  .ccc-mini h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); font-weight: 650; }
  .ccc-mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .ccc-mini-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ccc-mini-list li > b { flex: none; font-variant-numeric: tabular-nums; }
  .ccc-mini-kind { font-weight: 600; }
  .ccc-mini-time { flex: none; color: var(--ink-muted); font-size: 11.5px; white-space: nowrap; }
  .ccc-mini-count { font-size: 12.5px; margin-bottom: 6px; }
  .ccc-mini-more { margin-top: 6px; font-size: 11.5px; color: var(--ink-muted); }
  .ccc-mini-empty { font-size: 12.5px; color: var(--ink-muted); }
  .ccc-mini-link { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-align: left; cursor: pointer; }
  .ccc-mini-link:hover { text-decoration: underline; }
  .ccc-mini-cta { margin-top: 8px; font-size: 12.5px; font-weight: 600; }
  .ccc-donut-wrap { position: relative; display: flex; justify-content: center; }
  .ccc-donut { width: 100%; max-width: 220px; height: auto; }
  .ccc-donut-centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .ccc-donut-total { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; }
  .ccc-donut-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); font-weight: 650; margin-top: 5px; }
  /* Every slice is named and counted here — colour is never the only channel. */
  .ccc-dlegend { display: flex; flex-direction: column; max-width: 460px; }
  .ccc-dlegend-item { display: flex; align-items: baseline; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--hairline); }
  .ccc-dlegend-item:last-child { border-bottom: 0; }
  .ccc-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; align-self: center; }
  .ccc-dlegend-name { font-size: 12.5px; color: var(--ink-2); }
  .ccc-dlegend-n { margin-left: auto; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ccc-dlegend-pct { font-size: 11.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

  /* ---------- per-person stacked bars (Employee Monitor) ---------- */
  .ccc-pbars { display: flex; flex-direction: column; gap: 3px; }
  .ccc-pbar-row { display: grid; grid-template-columns: minmax(130px, 220px) 1fr 44px; gap: 12px; align-items: center; padding: 4px 0; }
  .ccc-pbar-row:hover { background: var(--wash); }
  .ccc-pbar-name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 2px surface gap between segments; the rounded ends belong to the bar. */
  .ccc-pbar { display: flex; gap: 2px; height: 14px; min-width: 6px; border-radius: 4px; overflow: hidden; }
  .ccc-pbar span { height: 100%; }
  .ccc-pbar-total { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
</style>
</head>
<body>
<div class="ccc-topnav">
  <div class="ccc-topnav-inner">
    <div class="ccc-brand"><span class="ccc-mark">CC</span> CFO Command Centre</div>
    <div class="ccc-search">
      <span class="ccc-search-icon">⌕</span>
      <input type="text" id="ccc-search-input" placeholder="Search tasks, employees, threads…" />
    </div>
    <div class="ccc-meta" id="ccc-health"></div>
    <button class="ccc-theme-toggle" id="ccc-theme-toggle" type="button">🌙 Dark mode</button>
  </div>
</div>
<div class="ccc-tabbar-wrap">
  <nav class="ccc-tabs" role="tablist" id="ccc-tabs"></nav>
</div>
<div class="ccc-shell">
  <main class="ccc-panel" id="ccc-panel"></main>
</div>
<div id="ccc-modal-root"></div>
<div id="ccc-chat-root"></div>

<script type="module">
// ---------------------------------------------------------------------------
// Category meta — colour + icon + label so identity is never colour-alone.
// ---------------------------------------------------------------------------
const CATEGORY_META = {
  received:  { label: 'Received',    icon: '✓', cls: 'ccc-cat-received',  colour: 'var(--good)' },
  early:     { label: 'Early',       icon: '⇧', cls: 'ccc-cat-early',     colour: 'var(--good)' },
  unclear:   { label: 'Unclear',     icon: '▲', cls: 'ccc-cat-unclear',   colour: 'var(--warning)' },
  overdue:   { label: 'Overdue',     icon: '✕', cls: 'ccc-cat-overdue',   colour: 'var(--critical)' },
  pending:   { label: 'Pending',     icon: '○', cls: 'ccc-cat-pending',   colour: 'var(--ink-muted)' },
  attention: { label: 'Needs data',  icon: '⚑', cls: 'ccc-cat-attention', colour: 'var(--serious)' },
};
const STATUS_META = {
  PENDING:  { icon: '○', colour: 'var(--warning)' },
  APPROVED: { icon: '✓', colour: 'var(--good)' },
  EXPIRED:  { icon: '✕', colour: 'var(--critical)' },
  RESENT:   { icon: '↻', colour: 'var(--ink-muted)' },
  SENT:     { icon: '✓', colour: 'var(--accent)' },
  DRAFTED:  { icon: '○', colour: 'var(--ink-muted)' },
  SKIPPED:  { icon: '⚑', colour: 'var(--serious)' },
};

// Kanban columns on the task tabs. One definition feeds the board, the donut and
// its legend, so what is drawn and what is counted can't drift apart. Placement
// is by the row's category (i.e. its Status cell) alone — the board never
// second-guesses Status with any other signal.
const COLUMNS = [
  { id: 'todo',    title: 'To Do',       cats: ['overdue'],           colour: 'var(--critical)',  icon: '✕', empty: 'Nothing overdue.' },
  { id: 'doing',   title: 'In Progress', cats: ['pending'],           colour: 'var(--ink-muted)', icon: '○', empty: 'Nothing pending.' },
  { id: 'review',  title: 'In Review',   cats: ['unclear'],           colour: 'var(--warning)',   icon: '▲', empty: 'Nothing unclear.' },
  { id: 'done',    title: 'Done',        cats: ['received', 'early'], colour: 'var(--good)',      icon: '✓', empty: 'Nothing received yet.' },
  // Rows failing the safety filter — the SAME array as the Needs attention
  // section under the board. Hatched in the donut: --serious sits ~ΔE 6 from
  // --critical (To Do), the two touch where the ring wraps, and no slice order
  // keeps red, amber and orange apart in a five-slice ring.
  { id: 'blocked', title: 'Blocked',     cats: ['attention'],         colour: 'var(--serious)',   icon: '⚑', empty: 'No blocked rows.', hatch: true },
];

// Employee Monitor's per-person chart shows this many bars, then one "Other".
const PERSON_TOP_N = 10;

const TABS = [
  { id: 'staff',     label: 'Staff Tracker',    icon: '📋' },
  { id: 'report',    label: 'Report Calendar',  icon: '🗓' },
  // One combined tab for both MIS registers, with a Monthly/Yearly sub-toggle —
  // they share Report Calendar's exact column layout, so two top-level tabs would
  // have been the same table twice.
  { id: 'mis',       label: 'MIS Checklist',    icon: '🧾' },
  { id: 'directory', label: 'Directory',        icon: '👥' },
  { id: 'monitor',   label: 'Employee Monitor', icon: '📈' },
  // Last tab, and the only one that writes nothing and reads no Sheet on load.
  { id: 'assistant', label: 'AI Assistant',     icon: '🤖' },
];

const state = {
  tab: 'staff',
  // AI Assistant. One conversation object drives BOTH the dedicated tab and the
  // floating widget — they are two views of the same session, never two chats.
  chat: {
    messages: [],        // [{role, content, createdAt}]
    draft: '',           // in-flight text, preserved across re-renders
    sending: false,
    loaded: false,       // this session's retained history has been fetched
    loadingHistory: false,
    widgetOpen: false,
    focus: null,         // 'tab' | 'widget' — which composer to hand focus back to
    error: null,
    warning: null,
  },
  monitorView: 'stats',
  // Top-nav search — filters the current tab's task list in real time.
  // Matched against task/report name, assigned-to name, and email.
  search: '',
  // Which MIS register the combined tab is showing. Set at boot from
  // /api/health's misSources (i.e. from CONFIG.REPORT_SOURCES), never hardcoded.
  misTab: null,
  expanded: null,
  health: null,
  data: {},       // per-tab payloads
  loading: false,
  error: null,
  formErrors: {},
  formNote: null,
  approving: {},  // runId -> 'busy' | message
  showExpiredApprovals: false, // collapsed by default so dead runs don't bury active ones
  taskTypeOptions: [],   // from GET /api/task-types — single canonical list
  taskTypeEditing: {},   // "tab|rowIndex" -> 'busy' | { ok, message } while an edit is in flight
  // Row edit form (Task List + Needs Attention, all sheet-backed tabs). Only one
  // row's form is ever open at a time, like `expanded` above.
  editingKey: null,      // "tab|rowIndex" of the row currently showing its edit form, or null
  // Where the open edit form lives: 'modal' (a card's detail modal) or 'audit'
  // (the Needs attention table — a needs-attention row has Edit in both). Only
  // the clicked one opens a form: edit submit reads the FIRST
  // [data-form="edit"] on the page, so two open copies would be ambiguous.
  editingSurface: 'modal',
  // "tab|rowIndex" of the board card whose detail modal is open, or null.
  detailModal: null,
  editFormErrors: {},
  editFormNote: null,
  // "Mark reviewed" — dashboard-only bookkeeping, collapsed by default per tab,
  // same pattern as showExpiredApprovals.
  showReviewed: {},       // tabId -> bool
  reviewedBusy: {},        // "tab|rowIndex" -> true while a mark/unmark POST is in flight
  // Row deletion. Non-null means the confirm modal is open for that row; a real
  // Sheet row deletion never happens without an explicit second click here.
  deleteModal: null,       // {tabName, rowIndex, taskDescription, assignedTo, emailId, busy, error}
  // Task-row fields this page relies on that an out-of-date server would not
  // send. Collected on every task load; any entry puts up the stale-server banner.
  missingFields: new Set(),
  // Manual Staff Tracker send flow (Report Calendar is unaffected — that tab
  // keeps the automated draft/approve/send pipeline exactly as before).
  staffSend: {
    selected: new Set(),   // rowIndex -> selected for preview
    previews: null,        // [{rowIndex, subject, body, ...}] once fetched, editable in place
    skipped: [],           // rows that couldn't be previewed, with why
    sending: false,
    result: null,          // { sentCount, failedCount, results } after send
  },
};

// --- utils -----------------------------------------------------------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = document.getElementById.bind(document);

// --- theme toggle ------------------------------------------------------------
// Manual override on top of the OS preference. Only writes an explicit
// data-theme (and localStorage entry) once the user actually toggles — until
// then the page keeps following the OS setting via the existing media query.
const THEME_KEY = 'ccc-theme';

function effectiveTheme() {
  const explicit = document.documentElement.getAttribute('data-theme');
  if (explicit === 'light' || explicit === 'dark') return explicit;
  return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function setThemeToggleLabel(theme) {
  const btn = el('ccc-theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
}

const storedTheme = localStorage.getItem(THEME_KEY);
if (storedTheme === 'light' || storedTheme === 'dark') {
  document.documentElement.setAttribute('data-theme', storedTheme);
}
setThemeToggleLabel(effectiveTheme());

el('ccc-theme-toggle').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  setThemeToggleLabel(next);
});

// Search input lives in the top nav, outside the panel render() rebuilds, so
// typing never loses focus or cursor position.
el('ccc-search-input').addEventListener('input', ev => {
  state.search = ev.target.value;
  render();
});

async function api(path, options) {
  const res = await fetch(path, {
    ...options,
    headers: options?.body ? { 'Content-Type': 'application/json' } : undefined,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || `Request failed (${res.status})`), { body, status: res.status });
  return body;
}

function badge(cat) {
  const m = CATEGORY_META[cat] || CATEGORY_META.pending;
  return `<span class="ccc-badge ${m.cls}"><span class="ccc-pdot" style="background:${m.colour}"></span><span class="ccc-icon">${m.icon}</span>${esc(m.label)}</span>`;
}
function statusBadge(status) {
  const s = String(status || '').toUpperCase();
  const m = STATUS_META[s] || { icon: '○', colour: 'var(--ink-muted)' };
  return `<span class="ccc-badge ccc-badge-${esc(s)}"><span class="ccc-pdot" style="background:${m.colour}"></span><span class="ccc-icon">${m.icon}</span>${esc(s)}</span>`;
}
function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? esc(v) : d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
}
function warnBox(msg) {
  return msg ? `<div class="ccc-warn"><span style="color:var(--serious)">⚑</span><span>${esc(msg)}</span></div>` : '';
}

const GMAIL_THREAD_BASE = 'https://mail.google.com/mail/u/0/#all/';

// "Sent" means Gmail returned a message id for a real dispatch. A draft sitting
// in the mailbox awaiting approval is explicitly NOT sent.
const MAIL_META = {
  sent:          { label: 'Sent',          icon: '✓', cls: 'ccc-mail-sent',   colour: 'var(--accent)' },
  draft_pending: { label: 'Draft pending', icon: '○', cls: 'ccc-mail-draft',  colour: 'var(--warning)' },
  failed:        { label: 'Send failed',   icon: '✕', cls: 'ccc-mail-failed', colour: 'var(--critical)' },
  none:          { label: 'Not sent',      icon: '–', cls: 'ccc-mail-none',   colour: 'var(--ink-muted)' },
};

function mailCell(mail) {
  if (!mail) return `<span class="ccc-badge ccc-mail-none"><span class="ccc-pdot" style="background:var(--ink-muted)"></span><span class="ccc-icon">–</span>Not sent</span>`;
  const meta = MAIL_META[mail.status] || MAIL_META.none;

  const parts = [`<span class="ccc-badge ${meta.cls}"><span class="ccc-pdot" style="background:${meta.colour}"></span><span class="ccc-icon">${meta.icon}</span>${esc(meta.label)}</span>`];

  if (mail.status === 'sent') {
    parts.push(`<div class="ccc-sub">${fmtDate(mail.lastSentAt)}</div>`);
    if (mail.messageId) {
      // Link straight to the sent message — proof, not just a claim.
      parts.push(
        `<div class="ccc-sub">${threadLink(mail.messageId, `id ${String(mail.messageId).slice(0, 10)}…`)}</div>`
      );
    }
    if (mail.sentCount > 1) parts.push(`<div class="ccc-sub">${mail.sentCount} sent total</div>`);
  } else if (mail.status === 'draft_pending') {
    parts.push(`<div class="ccc-sub">${mail.draftedCount} draft(s) awaiting approval</div>`);
  } else if (mail.status === 'failed') {
    parts.push(`<div class="ccc-sub ccc-note-bad">${esc((mail.lastError || 'unknown error').slice(0, 60))}</div>`);
  }

  if (mail.chronicallyOverdue) {
    parts.push(`<div class="ccc-sub ccc-chronic">🚩 chronically overdue — manual escalation</div>`);
  }

  return parts.join('');
}

/** Clickable Gmail thread link. */
function threadLink(threadId, label) {
  if (!threadId) return '';
  return `<a class="ccc-link" href="${GMAIL_THREAD_BASE}${encodeURIComponent(threadId)}" target="_blank" rel="noopener noreferrer">${esc(label || 'Open in Gmail')} ↗</a>`;
}

/** Local calendar date as YYYY-MM-DD (not UTC — toISOString() shifts the day). */
function todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function fmtBytes(n) {
  const b = Number(n) || 0;
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(0)} KB`;
  return `${(b / (1024 * 1024)).toFixed(1)} MB`;
}

/** Attachment download links, proxied through the API (Gmail needs auth). */
function attachmentLinks(attachments) {
  if (!attachments || attachments.length === 0) return '';
  return attachments
    .map(a => {
      const q = `messageId=${encodeURIComponent(a.messageId)}&attachmentId=${encodeURIComponent(a.attachmentId)}&filename=${encodeURIComponent(a.filename)}`;
      return `<a class="ccc-attach" href="/api/attachment?${q}" title="${esc(a.mimeType || '')} · ${fmtBytes(a.sizeBytes)}">📎 ${esc(a.filename)}</a>`;
    })
    .join(' ');
}

/**
 * Turn bare URLs inside Sheet-sourced text into real links. Remarks written by
 * the previous system embed Gmail URLs as plain text.
 */
function linkifyText(text) {
  const safe = esc(text || '');
  return safe.replace(/https?:\/\/[^\s<]+/g, url =>
    `<a class="ccc-link" href="${url}" target="_blank" rel="noopener noreferrer">${url.length > 48 ? url.slice(0, 45) + '…' : url}</a>`
  );
}

// --- data loading ----------------------------------------------------------
async function load(tab, { refresh = false } = {}) {
  state.loading = true; state.error = null; render();
  try {
    if (tab === 'staff' || tab === 'report' || tab === 'mis') {
      // MIS passes the register's EXACT sheet tab name — the server resolves it
      // by exact match, since "MIS_Closing_Report (M)" contains "report" and a
      // loose hint would land on Report Calendar instead.
      if (tab === 'mis' && !state.misTab) {
        throw new Error('No MIS register is configured — CONFIG.REPORT_SOURCES lists none on the MIS workbook.');
      }
      const q = tab === 'mis' ? state.misTab : tab === 'report' ? 'Report Calendar' : 'Staff Tracker';
      // The Directory comes along for the ride: the Add a Task form autofills
      // Email ID from it, so it has to be loaded before the form is rendered.
      const [tasks, attention, directory] = await Promise.all([
        api(`/api/tasks?tab=${encodeURIComponent(q)}${refresh ? '&refresh=1' : ''}`),
        api('/api/needs-attention'),
        api('/api/directory').catch(() => ({ employees: [] })),
      ]);
      state.data[tab] = { tasks: tasks.tasks, tab: tasks.tab, attention: attention.rows, sheetWarning: tasks.sheetWarning };
      loadTabSummary(tab); // deliberately not awaited — see loadTabSummary
      // A server that predates these fields renders them as blanks, not errors
      // — the Name column fell back to email-only with nothing to say why.
      for (const f of EXPECTED_TASK_FIELDS) {
        if ((tasks.tasks || []).some(t => !(f in t))) state.missingFields.add(f);
      }
      state.data.directory = directory;
    } else if (tab === 'assistant') {
      // No Sheet and no DB read here: the tab renders from state.chat, and the
      // conversation is fetched once by loadChatHistory().
      await loadChatHistory();
    } else if (tab === 'directory') {
      state.data.directory = await api('/api/directory');
    } else if (tab === 'monitor') {
      const [stats, logs, approvals] = await Promise.all([
        api('/api/stats'), api('/api/reminder-logs'), api('/api/approvals'),
      ]);
      state.data.monitor = { ...stats, logs: logs.logs, logWarning: logs.dbWarning, approvals: approvals.approvals, approvalWarning: approvals.dbWarning };
    }
  } catch (err) {
    state.error = err.message;
  } finally {
    state.loading = false; render();
  }
}

// --- views -----------------------------------------------------------------

// --- AI Assistant -----------------------------------------------------------

/**
 * The starter questions shown when a conversation is empty. Deliberately phrased
 * as things a CFO actually asks, not as a feature list — each one exercises a
 * different context block (sheet status, submissions, a named sheet, an
 * attachment summary), so a first-time user learns the range by using it.
 */
const CHAT_SUGGESTIONS = [
  'Show me all overdue reports',
  'Summarize the latest submission from Amarjyoti',
  "What's the status of the MIS Monthly sheet?",
  'Give me a CFO brief on the Budget Comparison attachment',
];

/**
 * sessionStorage, not localStorage: the conversation is a working session, and
 * closing the tab should end it. The server deletes anything older than 24 hours
 * anyway, so a long-lived id would only ever point at rows that no longer exist.
 */
function chatSessionId() {
  let id = sessionStorage.getItem('ccc-chat-session');
  if (!id) {
    id = crypto.randomUUID();
    sessionStorage.setItem('ccc-chat-session', id);
  }
  return id;
}

/** Load this session's retained history once, then keep it in memory. */
async function loadChatHistory() {
  if (state.chat.loaded || state.chat.loadingHistory) return;
  state.chat.loadingHistory = true;
  try {
    const res = await api(`/api/chat?sessionId=${encodeURIComponent(chatSessionId())}`);
    state.chat.messages = res.messages || [];
    state.chat.warning = res.dbWarning || null;
  } catch (err) {
    state.chat.warning = `Could not load earlier messages: ${err.message}`;
  } finally {
    state.chat.loaded = true;
    state.chat.loadingHistory = false;
    render();
  }
}

/**
 * Send one turn. The user's message is shown immediately and the reply appended
 * when it lands — both are also persisted server-side, so a reload inside the
 * same session shows the same conversation.
 */
async function sendChat(text) {
  const message = (text || '').trim();
  if (!message || state.chat.sending) return;

  state.chat.messages.push({ role: 'user', content: message, createdAt: new Date().toISOString() });
  state.chat.sending = true;
  state.chat.draft = '';
  state.chat.error = null;
  render();

  try {
    const res = await api('/api/chat', {
      method: 'POST',
      body: JSON.stringify({ message, sessionId: chatSessionId() }),
    });
    state.chat.messages.push({ role: 'assistant', content: res.reply, createdAt: new Date().toISOString() });
  } catch (err) {
    // The optimistic user bubble stays: it was really sent, and removing it would
    // make the failure look like the question was never asked.
    state.chat.error = err.body?.error || err.message;
  } finally {
    state.chat.sending = false;
    render();
  }
}

/** Message bubbles + typing indicator. Shared by the tab and the widget. */
function chatLog(idSuffix) {
  const c = state.chat;
  const bubbles = c.messages.map(m => `
    <div class="ccc-msg ccc-msg-${m.role === 'assistant' ? 'assistant' : 'user'}">
      <div class="ccc-bubble">${esc(m.content)}</div>
      <div class="ccc-msg-time">${fmtDate(m.createdAt)}</div>
    </div>`).join('');

  const typing = c.sending
    ? `<div class="ccc-msg ccc-msg-assistant"><div class="ccc-bubble"><span class="ccc-typing"><i></i><i></i><i></i></span></div></div>`
    : '';

  const empty = !c.messages.length && !c.sending
    ? `<div class="ccc-empty">${c.loaded ? 'Ask a question about tasks, reports, submissions or attachments.' : 'Loading…'}</div>`
    : '';

  return `<div class="ccc-chat-log" data-chat-log="${idSuffix}">${empty}${bubbles}${typing}</div>`;
}

/** Starter questions — only while there is nothing to read yet. */
function chatSuggestions() {
  if (state.chat.messages.length || state.chat.sending) return '';
  return `<div class="ccc-suggests">
    ${CHAT_SUGGESTIONS.map(q => `<button type="button" class="ccc-suggest" data-chat-suggest="${esc(q)}">${esc(q)}</button>`).join('')}
  </div>`;
}

function chatComposer(idSuffix) {
  const c = state.chat;
  return `
    ${c.error ? `<p class="ccc-note ccc-note-bad">${esc(c.error)}</p>` : ''}
    <form class="ccc-chat-composer" data-chat-form="${idSuffix}">
      <textarea class="ccc-chat-input" data-chat-input="${idSuffix}" rows="1" placeholder="Ask about tasks, reports, submissions…"
                ${c.sending ? 'disabled' : ''}>${esc(c.draft)}</textarea>
      <button class="ccc-btn" type="submit" ${c.sending ? 'disabled' : ''}>${c.sending ? 'Thinking…' : 'Send'}</button>
    </form>`;
}

function assistantView() {
  return `
    <div class="ccc-pagehead">
      <h1>AI Assistant</h1>
      <p>Ask about task and report status, who has submitted what, and what arrived in the attachments already summarised by the pipeline. Answers come from stored data only — no live mailbox is searched. Conversations are kept for 24 hours.</p>
    </div>
    ${warnBox(state.chat.warning)}
    <section class="ccc-card ccc-chat-tab">
      <div class="ccc-chat">
        ${chatSuggestions()}
        ${chatLog('tab')}
        ${chatComposer('tab')}
      </div>
    </section>`;
}

/** The floating bubble + slide-up panel, available on every tab. */
function renderChatWidget() {
  const root = el('ccc-chat-root');
  // Hidden on the dedicated tab — two live copies of the same conversation on
  // one screen is noise, not availability.
  if (state.tab === 'assistant') { root.innerHTML = ''; return; }

  root.innerHTML = `
    ${state.chat.widgetOpen ? `
      <div class="ccc-widget" role="dialog" aria-label="AI Assistant">
        <div class="ccc-widget-head">
          <b>🤖 AI Assistant</b>
          <button class="ccc-widget-close" type="button" data-chat-close aria-label="Close">×</button>
        </div>
        <div class="ccc-chat">
          ${chatSuggestions()}
          ${chatLog('widget')}
          ${chatComposer('widget')}
        </div>
      </div>` : ''}
    <button class="ccc-fab" type="button" data-chat-toggle aria-label="${state.chat.widgetOpen ? 'Close' : 'Open'} AI Assistant" aria-expanded="${state.chat.widgetOpen}">${state.chat.widgetOpen ? '×' : '💬'}</button>`;
}

/**
 * Keep the newest message in view, and hand focus back to whichever composer is
 * live — render() rebuilds both, so without this every keystroke after a send
 * would land nowhere.
 */
function restoreChatFocus() {
  document.querySelectorAll('[data-chat-log]').forEach(log => { log.scrollTop = log.scrollHeight; });
  const key = state.chat.focus;
  if (!key || state.chat.sending) return;
  const box = document.querySelector(`[data-chat-input="${key}"]`);
  if (box) {
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }
}

function taskView(tabId) {
  const d = state.data[tabId];
  if (!d) return '';
  const needle = state.search.trim().toLowerCase();
  const matches = t => !needle ||
    (t.taskDescription || '').toLowerCase().includes(needle) ||
    (t.assignedTo || '').toLowerCase().includes(needle) ||
    // personName too: it is what the Name line displays, so searching
    // "Karnesh" has to find the row whose Assigned To reads "Accounts team".
    (t.personName || '').toLowerCase().includes(needle) ||
    (t.emailId || '').toLowerCase().includes(needle);
  const tasks = (d.tasks || []).filter(matches);
  // "Mark reviewed" (dashboard-only, reviewed_tasks) splits the same search-
  // filtered set in two: the board shows only the active half, the rest move
  // to the collapsed Reviewed section below.
  const activeTasks = tasks.filter(t => !t.reviewedAt);
  const reviewedTasks = tasks.filter(t => t.reviewedAt);
  // ONE array feeds both the Blocked column and the Needs attention section
  // under the board, filtered by the same search once — the two placements can
  // never list different rows.
  const attention = (d.attention || []).filter(r => r.tabName === d.tab).filter(matches);

  const counts = boardRows.reduce((acc, t) => ({ ...acc, [t.category]: (acc[t.category] || 0) + 1 }), {});

  // through the same branch — "isReport" means "report-shaped", not "is the

  const isMis = tabId === 'mis';

  const canSelect = !isReport;

  const board = COLUMNS.map(c => {

    </div>

    ${subtabs}
    ${warnBox(d.sheetWarning)}

    <section class="ccc-card">
      <header><div>
        <h3>Status breakdown</h3>
        <p>One slice per board column, Blocked included — the total here is the total on the board below.</p>
      </div></header>
      <div class="ccc-donut-row">
        ${donut(counts)}${donutLegend(counts)}
        <div class="ccc-sumgrid" data-tab-summary>${summaryWidgets(tabId)}</div>
      </div>
    </section>

    <section class="ccc-card" style="padding:16px">
      <header style="margin-bottom:12px">
        <div>
          <h3>${isReport ? 'Report board' : 'Task board'}</h3>

        </div>

          false,

        ${field('taskType', 'Task type', 'select')}
        ${isReport ? field('dueDate', 'Review timing', 'text') : field('dateAssigned', 'Date assigned', 'date', true) + field('dueDate', 'Due date', 'date')}
